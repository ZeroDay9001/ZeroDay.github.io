<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buzz Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1C2631"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{ color-scheme:light;
  --paper:#E6ECF0; --surface:#F7F9FA; --ink:#1C2631; --muted:#56636F; --wire:#9C6E12; --band:rgba(156,110,18,.13); --ok:#127A5A; --buzz:#C42539; --warn:#8A5A00;
  --line:#C5CFD7; --chip:#DCE3E8; --side:#EEF2F5; --shadow:0 1px 2px rgba(20,30,40,.06),0 6px 20px rgba(20,30,40,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; --paper:#151C24; --surface:#1D2630; --ink:#E4EAF0; --muted:#93A1AE; --wire:#E0B755; --band:rgba(224,183,85,.16); --ok:#3CC79A; --buzz:#FF5468; --warn:#E8B24A; --line:#2C3843; --chip:#28333E; --side:#18212A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); } }
:root[data-theme="dark"]{ color-scheme:dark; --paper:#151C24; --surface:#1D2630; --ink:#E4EAF0; --muted:#93A1AE; --wire:#E0B755; --band:rgba(224,183,85,.16); --ok:#3CC79A; --buzz:#FF5468; --warn:#E8B24A; --line:#2C3843; --chip:#28333E; --side:#18212A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; height:100%; background:var(--surface); color:var(--ink); font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:grid; grid-template-columns:236px 1fr; grid-template-rows:auto 1fr; overflow:hidden; }
a{ color:inherit; }
:focus-visible{ outline:3px solid var(--wire); outline-offset:2px; }
.topbar{ grid-column:1 / -1; display:flex; align-items:center; gap:10px; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--surface); z-index:5; }
.brand{ display:flex; align-items:center; gap:9px; font-weight:800; font-size:1.2rem; letter-spacing:-.02em; text-decoration:none; }
.lamp{ width:15px; height:15px; border-radius:50%; border:3px solid var(--wire); }
.btn.navbtn{ display:none; }
.topbar .sp{ flex:1; }
.btn{ font:inherit; font-weight:700; border:0; border-radius:10px; padding:9px 14px; cursor:pointer; background:var(--chip); color:var(--ink); text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
.btn.primary{ background:var(--ink); color:var(--surface); } .btn.sm{ padding:6px 11px; font-size:.88rem; } .btn.danger{ color:var(--buzz); } .btn:disabled{ opacity:.45; cursor:not-allowed; }
#focusBtn{ font-variant-numeric:tabular-nums; } #focusBtn.running{ background:var(--band); outline:2px solid var(--wire); }
.side{ background:var(--side); border-right:1px solid var(--line); overflow-y:auto; padding:12px 10px; }
.nav{ display:flex; flex-direction:column; gap:2px; }
.nav .lab{ font-size:.72rem; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); padding:14px 10px 4px; }
.nav a{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; text-decoration:none; font-weight:600; }
.nav a:hover{ background:var(--chip); } .nav a.on{ background:var(--ink); color:var(--surface); }
.nav a .ic{ width:1.4em; text-align:center; }
main{ overflow:auto; position:relative; }
.view{ min-height:100%; }
.view.page{ padding:22px clamp(14px,3vw,34px) 40px; max-width:1180px; }
.view.trainer{ height:100%; }
.trainer-host{ display:block; height:100%; overflow:auto; }
h2{ font-size:1.7rem; letter-spacing:-.02em; margin:0 0 4px; } h3{ margin:0 0 10px; font-size:1.08rem; }
.sect{ margin:26px 0 10px; }
.muted{ color:var(--muted); } .small{ font-size:.85rem; } .pad{ padding:12px; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 18px; box-shadow:var(--shadow); margin-top:16px; }
.grid2{ display:grid; grid-template-columns:1.2fr 1fr; gap:16px; } .grid2 .card{ margin-top:16px; }
.hello{ display:flex; justify-content:space-between; align-items:flex-end; }
.hello p{ margin:2px 0 0; }
.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:16px; }
.stat{ background:var(--paper); border-radius:16px; padding:14px 16px; display:flex; flex-direction:column; justify-content:center; }
.stat b{ font-size:1.9rem; letter-spacing:-.02em; line-height:1.1; } .stat span{ color:var(--muted); font-size:.88rem; }
.stat.goal{ flex-direction:row; align-items:center; gap:12px; } .stat.goal div{ display:flex; flex-direction:column; } .stat.goal b{ font-size:1.4rem; }
.ring{ width:64px; height:64px; transform:rotate(-90deg); } .rbg{ fill:none; stroke:var(--chip); stroke-width:9; } .rfg{ fill:none; stroke:var(--wire); stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset .6s; }
.plan{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.plan li{ display:grid; grid-template-columns:2em 1fr auto; align-items:center; gap:10px; padding:9px 10px; border-radius:12px; background:var(--paper); }
.plan li.done{ opacity:.6; } .plan li.done b{ text-decoration:line-through; text-decoration-color:var(--muted); }
.pi{ font-size:1.3rem; text-align:center; } .pt{ display:flex; flex-direction:column; } .pt small{ color:var(--muted); } .chk{ color:var(--ok); font-weight:800; font-size:1.2rem; padding:0 8px; }
.weak{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.weak li{ display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; padding:8px 10px; border-radius:12px; background:var(--paper); }
.weak li span:first-child{ display:flex; flex-direction:column; } .weak small{ color:var(--muted); } .cnt{ color:var(--buzz); font-weight:800; font-variant-numeric:tabular-nums; }
.subjects{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
.subj{ font:inherit; color:inherit; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:6px; cursor:pointer; box-shadow:var(--shadow); }
.subj:hover{ border-color:var(--wire); } .si{ font-size:1.6rem; } .subj small{ font-size:.82rem; }
.bar{ display:block; height:7px; border-radius:9px; background:var(--chip); overflow:hidden; } .bar i{ display:block; height:100%; background:var(--wire); border-radius:9px; }
.bar i.good{ background:var(--ok); } .bar i.mid{ background:var(--wire); } .bar i.low{ background:var(--buzz); }
.heat{ display:grid; grid-template-rows:repeat(7,1fr); grid-auto-flow:column; grid-template-columns:repeat(var(--w),1fr); gap:3px; }
.heat i,.heatkey i{ display:block; aspect-ratio:1; border-radius:3px; background:var(--chip); min-width:8px; }
.heat .h1,.heatkey .h1{ background:color-mix(in srgb,var(--wire) 30%,var(--chip)); } .heat .h2,.heatkey .h2{ background:color-mix(in srgb,var(--wire) 55%,var(--chip)); } .heat .h3,.heatkey .h3{ background:color-mix(in srgb,var(--wire) 80%,var(--chip)); } .heat .h4,.heatkey .h4{ background:var(--wire); } .heat .hf{ background:transparent; }
.heatkey{ display:flex; align-items:center; gap:4px; font-size:.78rem; margin-top:8px; } .heatkey i{ width:11px; }
.tlist{ list-style:none; padding:0; margin:0 0 12px; } .tlist li{ display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:7px 0; border-bottom:1px solid var(--line); } .tlist small{ color:var(--muted); }
.score{ font-weight:800; font-variant-numeric:tabular-nums; } .score.good,.good{ color:var(--ok); } .score.mid{ color:var(--wire); } .score.low,.bad{ color:var(--buzz); }
.glist{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
.gcard{ display:flex; flex-direction:column; gap:4px; padding:13px 14px; border-radius:14px; border:1px solid var(--line); background:var(--surface); text-decoration:none; box-shadow:var(--shadow); }
.gcard:hover{ border-color:var(--wire); } .gcard small{ color:var(--muted); } .gcard.read{ background:var(--paper); }
.back{ display:inline-block; margin-bottom:10px; color:var(--muted); text-decoration:none; font-weight:600; }
.guide{ max-width:72ch; line-height:1.6; font-size:1.04rem; } .guide h3{ margin:22px 0 6px; } .guide ul{ padding-left:20px; } .guide li{ margin:5px 0; }
.ex,.warn{ border-radius:12px; padding:12px 14px; margin:14px 0; } .ex{ background:var(--band); } .warn{ background:color-mix(in srgb,var(--buzz) 9%,var(--surface)); }
.ex>span,.warn>span{ display:block; font-size:.74rem; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
.ex pre{ margin:0; font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace; font-size:.92rem; white-space:pre-wrap; } .warn ul{ margin:0; }
.pchips,.ntags{ display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px; }
.chip{ font:inherit; font-size:.88rem; font-weight:600; border:1.5px solid var(--line); background:transparent; color:var(--ink); border-radius:99px; padding:5px 12px; cursor:pointer; }
.chip:hover{ border-color:var(--wire); } .chip.on{ background:var(--ink); color:var(--surface); border-color:var(--ink); }
.gfoot{ display:flex; gap:8px; margin:18px 0; }
.askrow{ display:flex; gap:8px; } .askrow input,.form input,.form select,.addl input,.addl select,.brow input,.nhead input,.nhead select,#nSearch{ font:inherit; padding:9px 11px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); min-width:0; }
.askrow input{ flex:1; }
.aiout{ white-space:pre-wrap; margin-top:10px; line-height:1.5; } .aiout:empty{ display:none; }
.presets{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin-top:14px; }
.preset{ border:1px solid var(--line); border-radius:16px; padding:14px; background:var(--surface); box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px; }
.preset p{ margin:0; color:var(--muted); font-size:.92rem; line-height:1.4; flex:1; } .preset small{ color:var(--muted); } .ph{ display:flex; gap:8px; align-items:center; } .pic{ font-size:1.3rem; } .pb{ display:flex; gap:6px; margin-top:4px; }
.builder{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; } fieldset{ border:1px solid var(--line); border-radius:12px; padding:8px 12px 10px; display:flex; flex-direction:column; gap:4px; } legend{ font-weight:700; padding:0 4px; }
label.chk{ display:flex; gap:7px; align-items:center; cursor:pointer; } input[type=checkbox]{ accent-color:var(--wire); width:16px; height:16px; }
.brow{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px; } .brow label{ display:flex; gap:6px; align-items:center; } .brow input[type=number]{ width:5.5em; }
.thist{ width:100%; border-collapse:collapse; font-size:.92rem; } .thist th,.thist td{ text-align:left; padding:7px 4px; border-bottom:1px solid var(--line); } .thist th{ color:var(--muted); font-weight:600; }
.loading{ padding:40px; text-align:center; color:var(--muted); font-size:1.1rem; }
.exam{ max-width:880px; } .exhead{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; } .exprog{ font-variant-numeric:tabular-nums; color:var(--muted); margin-left:auto; } .extime{ font-weight:800; font-size:1.2rem; font-variant-numeric:tabular-nums; } .extime.low{ color:var(--buzz); }
.exnav{ display:flex; flex-wrap:wrap; gap:4px; margin:12px 0; } .exnav button{ font:inherit; font-size:.8rem; width:2.2em; height:2.2em; border-radius:8px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; font-variant-numeric:tabular-nums; }
.exnav .ans{ background:var(--chip); } .exnav .cur{ border-color:var(--wire); outline:2px solid var(--wire); } .exnav .fl{ border-color:var(--warn); border-style:dashed; } .exnav .ok{ background:color-mix(in srgb,var(--ok) 25%,var(--surface)); } .exnav .bad{ background:color-mix(in srgb,var(--buzz) 22%,var(--surface)); }
.exq{ background:var(--paper); border-radius:18px; padding:22px clamp(14px,3vw,30px); display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; }
.exq .sec{ font-size:.76rem; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
.qh{ font-size:clamp(1.3rem,3.4vw,1.9rem); font-weight:700; line-height:1.35; max-width:100%; }
.exq input,.exq textarea{ font:inherit; font-size:1.5rem; font-weight:700; text-align:center; width:min(440px,100%); padding:10px 14px; border:2px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace; }
.exq textarea{ text-align:left; font-size:1.15rem; resize:vertical; } .exq input:focus,.exq textarea:focus{ outline:none; border-color:var(--wire); }
.pv{ min-height:1.4em; color:var(--wire); font-weight:700; font-size:1.3rem; font-family:"Noto Sans JP",sans-serif; }
.exfb{ min-height:1.4em; } .exfb.good{ color:var(--ok); font-weight:700; } .exfb.bad{ color:var(--buzz); } .exfb.warn{ color:var(--warn); }
.exbtns{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; } .exbtns #exSubmit{ margin-left:auto; }
.results .rtop{ display:flex; gap:20px; align-items:center; } .results .big{ font-size:4rem; font-weight:800; letter-spacing:-.04em; } .results p{ margin:2px 0; }
.rsecs{ display:flex; flex-direction:column; gap:8px; margin:16px 0; max-width:560px; } .rsec{ display:grid; grid-template-columns:170px 1fr 3em; gap:10px; align-items:center; font-size:.92rem; }
.rbtns{ display:flex; gap:8px; flex-wrap:wrap; }
.review{ padding-left:22px; display:flex; flex-direction:column; gap:10px; } .review li{ background:var(--paper); border-radius:12px; padding:12px 14px; } .review li.bad{ border-left:4px solid var(--buzz); } .review li.ok{ border-left:4px solid var(--ok); }
.rq{ font-weight:600; } .rq .tag{ float:right; } .ra,.rc{ margin-top:6px; font-size:.95rem; }
.tag{ font-size:.75rem; color:var(--muted); background:var(--chip); border-radius:99px; padding:2px 8px; font-weight:600; }
/* question html from trainers */
.fr{ display:inline-flex; flex-direction:column; align-items:center; line-height:1; font-size:.85em; vertical-align:middle; } .fr span:first-child{ border-bottom:.08em solid currentColor; padding:0 .12em .06em; } .fr span:last-child{ padding:.06em .12em 0; }
.jp,[lang=ja]{ font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif; } .jq.kana,.jq.kanji{ font-size:3.2em; line-height:1.15; } .jq.word,.jq.num{ font-size:1.6em; } .furi{ font-size:.55em; color:var(--muted); font-weight:600; } .en{ font-weight:800; } .small2{ font-size:.6em; color:var(--muted); font-weight:500; } .blank{ color:var(--wire); border-bottom:3px solid var(--wire); padding:0 .2em; } .sent{ font-size:1.1em; }
code,.codeq,pre.want,.mdcode{ font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace; font-variant-ligatures:none; } .qh code{ background:var(--band); padding:.04em .28em; border-radius:.2em; font-size:.92em; }
.codeq{ text-align:left; font-size:.62em; font-weight:500; background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; margin:6px auto 0; width:fit-content; max-width:100%; overflow-x:auto; line-height:1.5; }
.codeq .k{ color:var(--wire); font-weight:700; } .codeq .s{ color:var(--ok); } .codeq .n{ color:var(--buzz); } .codeq .c{ color:var(--muted); font-style:italic; }
.qlabel{ font-size:.6em; color:var(--muted); } pre.want{ display:inline-block; text-align:left; margin:4px 0; background:var(--band); padding:4px 8px; border-radius:6px; }
.ctx{ font-size:.65em; color:var(--muted); font-weight:500; } .ctx code{ color:var(--ink); font-weight:700; } .long{ font-size:.75em; } .eqq .sys{ display:flex; flex-direction:column; align-items:center; }
/* notes */
.notes{ display:grid; grid-template-columns:300px 1fr; gap:16px; min-height:70vh; }
.nlist{ display:flex; flex-direction:column; gap:6px; } .nbar{ display:flex; gap:6px; } #nSearch{ flex:1; }
.nitem{ font:inherit; color:inherit; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:10px 12px; cursor:pointer; display:flex; flex-direction:column; gap:2px; }
.nitem.on{ border-color:var(--wire); background:var(--band); } .nitem small{ color:var(--muted); font-size:.78rem; } .nitem span{ color:var(--muted); font-size:.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.neditor{ display:flex; flex-direction:column; gap:8px; } .nhead{ display:flex; gap:8px; } .nhead input{ flex:1; font-size:1.2rem; font-weight:700; }
.ntools{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.neditor textarea{ font:inherit; flex:1; min-height:52vh; padding:14px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); line-height:1.55; resize:vertical; }
.mdview{ border:1.5px solid var(--line); border-radius:12px; padding:6px 16px; min-height:52vh; line-height:1.6; } .mdcode{ background:var(--paper); padding:10px; border-radius:8px; overflow-x:auto; }
.empty{ display:grid; place-items:center; min-height:40vh; color:var(--muted); border:1.5px dashed var(--line); border-radius:14px; }
/* links */
.links{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
.lcard{ border:1px solid var(--line); border-radius:14px; padding:13px 14px; background:var(--surface); box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px; }
.lcard a{ text-decoration:none; display:flex; flex-direction:column; } .lcard a b{ color:var(--ink); } .lcard a:hover b{ text-decoration:underline; } .lcard small{ color:var(--muted); } .lcard p{ margin:0; font-size:.92rem; line-height:1.4; flex:1; } .lcard .tag{ align-self:flex-start; }
.addl{ display:grid; grid-template-columns:1fr 1.4fr auto 1.4fr auto; gap:8px; }
.form{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; align-items:end; } .form label{ display:flex; flex-direction:column; gap:4px; font-weight:600; font-size:.92rem; }
details{ margin-top:12px; } summary{ cursor:pointer; font-weight:700; } .steps li{ margin:6px 0; line-height:1.5; }
#pData{ font:inherit; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:.8rem; width:100%; margin-top:10px; padding:10px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); }
.toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:10px 16px; border-radius:12px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s; z-index:50; max-width:calc(100% - 24px); text-align:center; }
.toast.show{ opacity:1; }
.scrim{ display:none; }

@media (max-width:900px){
  body{ grid-template-columns:1fr; }
  .btn.navbtn{ display:inline-flex; }
  .side{ position:fixed; top:0; left:0; bottom:0; width:260px; z-index:20; transform:translateX(-100%); transition:transform .2s; padding-top:calc(12px + env(safe-area-inset-top,0px)); }
  body.navopen .side{ transform:none; } body.navopen .scrim{ display:block; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:15; }
  .grid2{ grid-template-columns:1fr; } .stats{ grid-template-columns:repeat(2,1fr); } .subjects{ grid-template-columns:repeat(2,1fr); } .achs{ grid-template-columns:repeat(2,1fr); }
  .notes{ grid-template-columns:1fr; } .addl{ grid-template-columns:1fr; } .rsec{ grid-template-columns:110px 1fr 3em; }
  .brand span.t{ display:none; } #focusReset{ display:none; }
}
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

/* native trainers */
.nhead2{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; } .nhead2 h2{ margin:0; }

/* ================= scoring ================= */
function evalStroke(raw,s){

function finishStroke(){
  const pts=current.pts; pts.stalls=current.stalls; current=null; wasOff=false;
  if(pts.length<2||pathLen(pts)<8){ render(); return; }
  let chosen=-1,res=null;
  if(target.ordered){
    const exp=target.strokes[nextIdx]; if(!exp){ render(); return; }
    const rExp=evalStroke(pts,exp);
    if(rExp.meanDev>2.5*T && target.strokes.some((s,j)=>j<nextIdx && evalStroke(pts,s).meanDev<1.5*T)){

    }
    for(let j=nextIdx+1;j<target.strokes.length;j++){
      const rj=evalStroke(pts,target.strokes[j]);
      if(rj.meanDev<0.55*rExp.meanDev&&rj.meanDev<1.6*T){
        orderMistakes++; tone(140,0.16,"square",0.05);

      }

    prog.dir.push({ b:dirBucket(pts[0],pts[pts.length-1]), a:Math.round(res.acc*1000)/1000, L:pathLen(pts)>S*0.45?1:0, t:Date.now() });

/* ================= critique diagnostics (patterns from community critiques) ================= */
function pca(pts){
  const n=pts.length; let cx=0,cy=0; pts.forEach(p=>{cx+=p.x;cy+=p.y;}); cx/=n; cy/=n;
  let sxx=0,syy=0,sxy=0; pts.forEach(p=>{ const dx=p.x-cx, dy=p.y-cy; sxx+=dx*dx; syy+=dy*dy; sxy+=dx*dy; });

const angDiff=(a,b)=>{ let d=Math.abs(a-b)%Math.PI; return Math.min(d,Math.PI-d); };
function lineDiag(u, s){
  const a=s.pts[0], b=s.pts[s.pts.length-1], L=dist(a,b)||1, ux=(b.x-a.x)/L, uy=(b.y-a.y)/L;
  let pts=u.res.rs; const raw=u.raw;

  const seg=(f0,f1)=>{ const sl=off.slice(Math.floor(n*f0),Math.max(Math.floor(n*f0)+1,Math.floor(n*f1))); return sl.reduce((x,y)=>x+y,0)/sl.length; };

}
function ellipseDiag(u, s){

function diagnose(){

  const ells=userStrokes.filter(u=>target.strokes[u.si].closed);
  // --- line habits
  if(lines.length){
    const D=lines.map(u=>({u,d:lineDiag(u,target.strokes[u.si])}));
    const arcing=D.filter(x=>Math.abs(x.d.arc)>0.5*T && dist(x.d.a,x.d.b)>S*0.2);
    if(arcing.length) add(7,(arcing.length===1&&D.length===1?"Your line bows into an arc. ":"Some long lines bow into arcs. ")+"That’s the classic sign of pivoting from the wrist or elbow. Lock them and move from the shoulder.");

    const scratch=lines.filter(u=>u.res.cov<0.5);

          const orient=(x,st)=>{ const p0=x.u.raw[0], p1=x.u.raw[x.u.raw.length-1]; return dist(p0,st.near)<=dist(p1,st.near)?[p0,p1]:[p1,p0]; };

          const mid=P((da.x/la+db.x/lb)/2,(da.y/la+db.y/lb)/2), nn=P(-mid.y,mid.x);

/* --- line checkers for advanced modes --- */
function stripLead(s){ const i=s.lastIndexOf("="); return i>=0 ? s.slice(i+1) : s; }
function polyDiag(user, target){
  if(!user||!target) return null; const n=Math.max(user.length,target.length), U=[...user], T=[...target]; while(U.length<n) U.push(0); while(T.length<n) T.push(0);
  const diff=[]; for(let j=0;j<n;j++) if(!close(U[j],T[j])) diff.push(j);
  const nm=j=> j===0?"constant": j===1?"x": "x"+sup(j);
  if(diff.length===1){ const j=diff[0]; if(close(U[j],-T[j])) return {type:"sign",msg:"Sign slip on the "+nm(j)+" term."};
    if(j===1 && close(U[1],0)) return {type:"middle",msg:"The x term is missing. When multiplying binomials, the outer and inner products make the middle term."};
    return {type:"term",msg:"Everything matches except the "+nm(j)+" term. Recheck how you got it."}; }
  if(diff.length===2 && diff.every(j=>close(U[j],-T[j]))) return {type:"sign",msg:"Two terms have flipped signs. Check how the negatives distributed."};
  return null;
}
function modeCheck(prob, raw, rep){
  const s=cleanInput(raw); if(!s) return {empty:true};
  if(prob.mode==="expr"){
    const vars=prob.integral?["x","C"]:["x"]; let P;
    try { P=parseExprStr(stripLead(s).replace(/\+\s*C\s*$/i,""), vars); } catch(e){ return {state:"warn", msg:e.user||"I couldn’t read that."}; }
    const uf=x=>P.f({x,C:0}), xs=prob.xs||XS;
    let eqv;
    if(prob.integral){ const h=1e-5, dF=x=>(uf(x+h)-uf(x-h))/(2*h), I=prob.ref; let n=0, good=true; for(const x of xs){ const a=dF(x), b=I(x); if(!Number.isFinite(a)||!Number.isFinite(b)) continue; if(Math.abs(a-b)>1e-4*Math.max(1,Math.abs(b))) { good=false; break; } n++; } eqv=good&&n>=4; }

      if(prob.final==="standard"){ const f=standardForm(P.node); if(!f.ok) return {state:"ok", note:"Equal. "+f.why}; }
      if(prob.final==="factored"){ const f=fullyFactored(P.node); if(!f.ok) return {state:"ok", note:"Equal. "+f.why}; }
      return {state:"ok", solved:true};
    }
    const hy=(prob.integral?(prob.ihyps||[]).map(h=>({f:fnOf(h[0]),msg:h[1],type:h[2],anti:true})):(prob.hyps||[]));
    for(const h of hy){
      if(h.anti){ const hh=1e-5, dF=x=>(uf(x+hh)-uf(x-hh))/(2*hh), dH=x=>(h.f(x+hh)-h.f(x-hh))/(2*hh); if(equivFn(uf,h.f,xs)||equivFn(dF,dH,xs)) return {state:"bad",msg:h.msg,type:h.type}; }
      else if(equivFn(uf,h.f,xs)) return {state:"bad",msg:h.msg,type:h.type};
    }
    if(prob.final==="factored"){ const uc=polyCoeffs(uf), tc=polyCoeffs(prob.ref);
      if(uc&&tc&&uc.length===3&&tc.length===3&&close(uc[2],tc[2])){
        if(close(uc[0],tc[0])) return {state:"bad",type:"factorsign",msg:"Your factors multiply to the right constant, but the middle term comes out as "+polyStr([0,uc[1]])+" instead of "+polyStr([0,tc[1]])+". Check the signs, or pick a pair that also adds correctly."};
        if(close(uc[1],tc[1])) return {state:"bad",type:"factorpair",msg:"The middle term works, but the constant comes out as "+fmtR(uc[0])+" instead of "+fmtR(tc[0])+"."};
      }
      if(uc&&tc) return {state:"bad",type:"factorcheck",msg:"Multiply your factors back out: they give "+polyStr(uc)+", not "+polyStr(tc)+"."};
    }
    if(prob.final!=="any"){ const uc=polyCoeffs(uf), tc=polyCoeffs(prob.ref); const d=polyDiag(uc,tc); if(d) return Object.assign({state:"bad"},d);
      if(prob.sq && uc && tc && uc.length===3 && close(uc[1],0)) return {state:"bad",type:"square",msg:"(A + B)² isn’t A² + B². You need the 2AB middle term."}; }
    return {state:"bad", type:"arith", msg: prob.final==="any" ? "That isn’t equal to the derivative. Check each term." : "This isn’t equal to the original expression. Recheck this step."};
  }
  if(prob.mode==="quad"){
    const q=quadLine(s); if(q.error) return {state:"warn",msg:q.error};
    if(sameSet(q.roots,prob.roots)){ if(q.iso&&!q.unsimp) return {state:"ok",solved:true}; return {state:"ok",note:q.iso?"Equal. Simplify the numbers.":""}; }

    const r=ineqLine(s); if(r.error) return {state:"warn",msg:r.error};

    if(rep.foundY) return {state:"ok",note:"y is done. Plug it back in to find x."};
    return {state:"ok"};
  }
  return {state:"warn",msg:"Unknown problem type."};
}

function onRoundInput(){

function submitRound(enter){
  const inp=$("ans"), q=curQ(); const raw=inp.value; if(!raw.trim()) return;
  const t=(performance.now()-rep.t0)/1000; if(rep.firstT==null) rep.firstT=t;

  else { res=q.check(raw); if(res.invalid){ const fb=$("fb"); fb.textContent=res.invalid; fb.className="fb warn"; return; } }
  rep.tries++;

function noteFact(q, first, t){

  f.seen++; if(!first) f.miss++; if(t>stageDef().target*1.5) f.slow++;

}
function finishRound(){

  const pass=passFirst&&passTime;
  const reasons=[]; if(!passFirst) reasons.push("first-try accuracy needs "+Math.round(needFirst*100)+"%"); if(!passTime) reasons.push("average time needs to be "+sd.target+"s or less");

  if(rep.track==="mental"){
    if(missed.length) tips.push("Missed: "+missed.map(x=>x.text).join(", ")+". These come back more often.");
    const slow=r.filter(x=>x.first&&x.t>sd.target*1.5); if(slow.length) tips.push("Slow but right: "+slow.map(x=>x.text).join(", ")+". Aim for instant recall.");
  } else {
    if(missed.length) tips.push(missed.length+" missed. Open Patterns to see which mistake types repeat.");
  }
  if(!tips.length) tips.push(pass?"Clean round.":"Keep at it.");
  const rows=[ ["First try", first, needFirst, Math.round(first*n)+" of "+n], ["Speed", speed, 1, avgT.toFixed(1)+"s avg (target "+sd.target+"s)"] ];
  completeRep(score, pass, reasons, rows, tips);
}

function lastGood(){ for(let i=rep.lines.length-1;i>=0;i--){ if(rep.lines[i].state==="ok") return rep.lines[i].eq; } return parseEquation(rep.prob.src); }

    else if(e.key==="ArrowUp" && !inp.value){ e.preventDefault(); const k=rep.lines.indexOf(L); const src = k>0 ? rep.lines[k-1].inp.value : (rep.prob.src||""); inp.value=src; }

function linearCheck(raw){
  const eq=parseEquation(raw); if(eq.empty) return {empty:true};

}
function checkLine(L){

  if(r.state==="warn"){ L.msg.textContent=r.msg; L.li.className="warn"; L.st.textContent="?"; return; }
  if(r.state==="ok"){
    L.state="ok"; L.eq=r.eq||null; L.li.className="ok"; L.st.textContent="✓"; L.msg.textContent=r.note||""; L.inp.readOnly=true; ding();

  L.state="bad"; L.li.className="bad"; L.st.textContent="✗"; L.msg.textContent=r.msg; buzz();

/* ================= completion, streaks, unlocks ================= */
function completeRep(score, pass, reasons, rows, tips){
  const key=skey(), inWarm=settings.track==="warmup";
  let cleared=false, testMsg="", provisional=false;
  const t=prog.testout;
  if(!inWarm && t && t.k===cur.track && t.i===cur.idx && cur.idx>prog.unlocked[cur.track]){
    t.n = pass ? t.n+1 : 0;
    if(t.n>=3){ prog.unlocked[cur.track]=cur.idx; for(let j=0;j<cur.idx;j++) prog.cleared[cur.track+":"+j]=true; prog.testout=null; testMsg="Tested out! Stages up to "+stageDef().name+" are unlocked."; }
  } else if(!inWarm){
    prog.streak[key]= pass ? (prog.streak[key]||0)+1 : 0; const PEND_MS=12*3600000; prog.pending=prog.pending||{};
    if(pass&&prog.pending[key]&&!prog.cleared[key]&&Date.now()-prog.pending[key]>=PEND_MS){ delete prog.pending[key]; prog.streak[key]=0; cleared=true; prog.cleared[key]=true; }
    else if(prog.streak[key]>=3){ prog.streak[key]=0; if(!prog.cleared[key]&&!prog.pending[key]){ prog.pending[key]=Date.now(); provisional=true;
      if(cur.idx+1<TRACKS[cur.track].stages.length){ prog.unlocked[cur.track]=Math.max(prog.unlocked[cur.track],cur.idx+1); if(settings.track===cur.track) settings.stage[cur.track]=cur.idx+1; } } }
  }
  if(inWarm){ warm.scores.push({ name:TRACKS[cur.track].name+", "+stageDef().name, s:score }); warm.i++;
    if(warm.i>=warm.plan.length && !prog.warm.days.includes(todayKey())) prog.warm.days.push(todayKey()); }
  history.push({ t:Date.now(), k:cur.track, g:cur.idx, s:score, p:pass?1:0 }); if(history.length>1500) history=history.slice(-1500);
  saveLocal(); scheduleSync(); session.reps++; session.total+=score; updateSession();
  if(pass) chime();
  showResult(score, pass, reasons, rows, tips, cleared);
  if(provisional){ const v=$("result").querySelector(".verdict"); if(v){ v.className="verdict pass"; v.textContent="Pass. 3 in a row! Next stage unlocked. Pass this stage once more on a later visit (12+ hours from now) to lock it in."; } toast("Next stage unlocked. Come back to this one tomorrow to lock it in.",4500); }
  buildStages(); updatePrompt();
  if(testMsg) toast(testMsg,4000);
  else if(cleared){ const nx=TRACKS[cur.track].stages[cur.idx+1]; toast(nx?"Stage cleared! Next up: "+nx.name+".":"Final stage cleared. Keep it sharp in Review.",4000); }
}

"], ["10", "'Buzz'"], ["15", "'FizzBuzz'"], ["7", "'7'"], ["30", "'FizzBuzz'"]], "vis": 2, "hints": ["Check the both-divisible case first, or it never gets reached.", "Use str(n) for the last case."], "sol": "def fizzbuzz(n):\n    if n % 15 == 0:\n        return \"FizzBuzz\"\n    if n % 3 == 0:\n        return \"Fizz\"\n    if n % 5 == 0:\n        return \"Buzz\"\n    return str(n)"}, {"stage": 1, "id": "sign", "title": "Sign of a number", "prompt": "Return \"positive\", \"negative\", or \"zero\".", "sig": "sign(n)", "tests": [["5", "'positive'"], ["-2", "'negative'"], ["0", "'zero'"], ["-100", "'negative'"]], "vis": 2, "hints": ["Three cases: > 0, < 0, and everything else."], "sol": "def sign(n):\n    if n > 0:\n        return \"positive\"\n    if n < 0:\n        return \"negative\"\n    return \"zero\""}, {"stage": 2, "id": "sum_to", "title": "Sum 1 to n", "prompt": "Return 1 + 2 + … + n using a loop.", "sig": "sum_to(n)", "tests": [["5", "15"], ["1", "1"], ["10", "55"], ["0", "0"], ["100", "5050"]], "vis": 2, "hints": ["Start a total at 0 and add each number.", "range(1, n + 1) includes n."], "sol": "def sum_to(n):\n    total = 0\n    for i in range(1, n + 1):\n        total += i\n    return total"}, {"stage": 2, "id": "factorial", "title": "Factorial", "prompt": "Return n! (1 × 2 × … × n). 0! is 1.", "sig": "factorial(n)", "tests": [["5", "120"], ["0", "1"], ["1", "1"], ["6", "720"], ["10", "3628800"]], "vis": 2, "hints": ["Start the result at 1, not 0.", "Multiply by each number in range(2, n + 1)."], "sol": "def factorial(n):\n    result = 1\n    for i in range(2, n + 1):\n        result *= i\n    return result"}, {"stage": 2, "id": "count_vowels", "title": "Count vowels", "prompt": "Return how many vowels (a, e, i, o, u, any case) are in the string s.", "sig": "count_vowels(s)", "tests": [["'hello'", "2"], ["'SKY'", "0"], ["'Education'", "5"], ["''", "0"], ["'AEIOU aeiou'", "10"]], "vis": 2, "hints": ["Loop over each character.", "Lower-case it and check: if licates removed, keeping the first time each value appears.", "sig": "dedupe(nums)", "tests": [["[1, 2, 1, 3, 2]", "[1, 2, 3]"], ["[]", "[]"], ["[5, 5, 5]", "[5]"], ["[3, 1, 2]", "[3, 1, 2]"]], "vis": 2, "hints": ["set() loses the order. Build a new list instead.", "Only append a value if it isn’t already in the new list."], "sol": "def dedupe(nums):\n    out = []\n    for n in nums:\n        if n not in out:\n            out.append(n)\n    return out"}, {"stage": 3, "id": "running_total", "title": "Running total", "prompt": "Return a list where each item is the sum of everything up to that point.", "sig": "running_total(nums)", "tests": [["[1, 2, 3]", "[1, 3, 6]"], ["[]", "[]"], ["[5]", "[5]"], ["[2, -2, 2]", "[2, 0, 2]"]], "vis": 2, "hints": ["Keep a total and append it after each addition."], "sol": "def running_total(nums):\n    out, t = [], 0\n    for n in nums:\n        t += n\n        out.append(t)\n    return out"}, {"stage": 3, "id": "second_largest", "title": "Second largest", "prompt": "Return the second-largest distinct value in a list that has at least two distinct values.", "sig": "second_largest(nums)", "tests": [["[3, 7, 5]", "5"], ["[3, 7, 7, 5]", "5"], ["[1, 2]", "1"], ["[-1, -3, -2]", "-2"], ["[10, 10, 9, 8]", "9"]], "vis": 2, "hints": ["Duplicates of the largest don’t count as second.", "sorted(set(nums)) gives distinct values in order."], "sol": "def second_largest(nums):\n    return sorted(set(nums))[-2]"}, {"stage": 4, "id": "capitalize_words", "title": "Capitalize words", "prompt": "Return the string with the first letter of each word in upper case (words are separated by single spaces).", "sig": "capitalize_words(s)", "tests": [["'hello world'", "'Hello World'"], ["'a'", "'A'"], ["''", "''"], ["'open the port'", "'Open The Port'"]], "vis": 2, "hints": ["split(\" \") gives the words. Capitalize each, then \" \".join(...) them."], "sol": "def capitalize_words(s):\n    return \" \".join(w[:1].upper() + w[1:] for w in s.split(\" \"))"}, {"stage": 4, "id": "is_palindrome", "title": "Palindrome", "prompt": "Return True if s reads the same backwards, ignoring case and spaces.", "sig": "is_palindrome(s)", "tests": [["'racecar'", "True"], ["'Never odd or even'", "True"], ["'router'", "False"], ["''", "True"], ["'Ab a'", "True"]], "vis": 2, "hints": ["Clean it first: lower-case and remove spaces.", "Compare the cleaned string to cleaned[::-1]."], "sol": "def is_palindrome(s):\n    t = s.lower().replace(\" \", \"\")\n    return t == t[::-1]"}, {"stage": 4, "id": "count_words", "title": "Count words", "prompt": "Return the number of words in s. Words are separated by any amount of whitespace.", "sig": "count_words(s)", "tests": [["'hello world'", "2"], ["''", "0"], ["'  spaced   out  '", "2"], ["'one'", "1"]], "vis": 2, "hints": ["s.split() with no argument handles extra spaces."], "sol": "def count_words(s):\n    return len(s.split())"}, {"stage": 4, "id": "initials", "title": "Initials", "prompt": "Return the upper-case initials of a full name, like \"Ada Lovelace\" → \"AL\".", "sig": "initials(name)", "tests": [["'Ada Lovelace'", "'AL'"], ["'grace brewster hopper'", "'GBH'"], ["'Linus'", "'L'"]], "vis": 2, "hints": ["Split into words and take w[0] of each."], "sol": "def initials(name):\n    return \"\".join(w[0].upper() for w in name.split())"}, {"stage": 4, "id": "caesar", "title": "Caesar shift", "prompt": "Shift each lowercase letter forward by k places, wrapping z to a. Leave other characters unchanged.", "sig": "caesar(s, k)", "tests": [["'abc', 1", "'bcd'"], ["'xyz', 2", "'zab'"], ["'hi there', 3", "'kl wkhuh'"], ["'a-b', 25", "'z-a'"]], "vis": 2, "hints": ["ord() turns a letter into a number and chr() turns it back.", "(ord(ch) - ord(\"a\") + k) % 26 handles the wrap-around."], "sol": "def caesar(s, k):\n    out = \"\"\n    for ch in s:\n        if \"a\" <= ch <= \"z\":\n            out += chr((ord(ch) - ord(\"a\") + k) % 26 + ord(\"a\"))\n        else:\n            out += ch\n    return out"}, {"stage"   if(th) s+= naive ? (th===1?"せん":ONES[th]+"せん") : (th===1?"せん":th===3?"さんぜん":th===8?"はっせん":ONES[th]+"せん");
  if(h) s+= naive ? (h===1?"ひゃく":ONES[h]+"ひゃく") : (h===1?"ひゃく":h===3?"さんびゃく":h===6?"ろっぴゃく":h===8?"はっぴゃく":ONES[h]+"ひゃく");
  if(t) s+=(t===1?"":ONES[t])+"じゅう"; if(o) s+=ONES[o]; return s; }
function numReading(n,naive){ if(n===0) return "ぜろ"; const man=Math.floor(n/1e4), r=n%1e4; return (man?under1e4(man,naive)+"まん":"")+under1e4(r,naive); }
function numAlts(n){ const base=numReading(n), alts=[base]; if(n<100){ const o=n%10, pre=base.slice(0,base.length-ONES[o].length); if(o===4) alts.push(pre+"し"); if(o===7) alts.push(pre+"しち"); if(o===9) alts.push(pre+"く"); } if(n===0) alts.push("れい"); return alts; }

/* ===== Guides: one per track. Blocks: [type, content]. p=paragraph, h=heading, ul=list, ex=example (html), warn=common mistakes ===== */
const GUIDES=[
 {id:"learn",app:"hub",track:null,title:"How this works: tight feedback loops",mins:4,body:[
  ["p","Every trainer here is built on one idea: <b>find out you’re wrong while you’re still doing the thing.</b> A tutorial tells you afterwards. A tight loop tells you mid-stroke, mid-step, mid-answer, while you still remember exactly what your hand or head was doing. That’s when a correction actually lands."],
  ["h","The rules every trainer follows"],
  ["ul",["<b>Instant feedback:</b> the buzz, the red line, the ✗. It names <i>why</i>, not just that you’re wrong.","<b>Strict, spaced passing:</b> 3 passes in a row unlocks the next stage; one more pass on a later visit locks the stage in. Minimums on every metric stop one strength from hiding a weakness.","<b>Fading help:</b> guides go from full, to dots, to solo. The goal is to become your own buzzer.","<b>Test-outs:</b> already know something? Pass a locked stage 3 times in a row and skip ahead.","<b>Patterns:</b> every mistake is sorted by type, so habits show up that a single rep can’t reveal."]],
  ["h","Why strict is kind"],
  ["p","Passing on a lucky rep teaches nothing. Three in a row shows the skill is there today; passing again tomorrow shows it stuck. If a stage feels impossible rather than hard, that’s worth flagging. Hard is the point; impossible is a tuning problem."]],practice:[]},
 {id:"study",app:"hub",track:null,title:"Studying smarter: spacing, retrieval, notes",mins:5,body:[
  ["p","Three techniques beat almost everything else in learning research, and this app is built around them."],
  ["h","1. Retrieval practice"],["p","Pull answers out of your head instead of rereading. Every round here is retrieval. Rereading notes <i>feels</i> productive but builds far less."],
  ["h","2. Spacing"],["p","Review just before you’d forget, with growing gaps: a day, 3 days, a week, two weeks. Japanese Daily review does this automatically. For other subjects, Warm-up and Review bring old stages back."],
  ["ul",["Test in a week: review about a day apart.","Test in a month: every 3–5 days.","Keep it for a year: every 3–4 weeks once it’s solid.","Twenty minutes a day beats a three-hour cram, even with the same total."]],
  ["h","3. Notes built for quizzing"],["p","Your style of putting ideas into your own words is a strength. Make it complete with three additions:"],
  ["ul",["<b>Plain-language version + precise terms</b> side by side.","<b>“Where this breaks”:</b> one line on where your analogy stops being true. Exam questions live there.","<b>One example</b> that shows the rule and its main exception together."]],
  ["ex","<b>DNS</b> is a phone book for websites. <i>Breaks:</i> it isn’t one book; servers pass the question along. <i>Example:</i> your PC asks a resolver, which asks root → .com → the domain’s own server."]],practice:[]},
 /* ---------- drawing ---------- */
 {id:"w-lines",app:"wire",track:"lines",title:"Lines: confidence before accuracy",mins:4,body:[
  ["p","A good line is <b>straight, smooth and lands on its end point</b>, in that order of difficulty. Accuracy comes with reps; wobble comes from trying to be accurate too early."],
  ["h","The ghosting method"],["ul",["Place the pen at the start point.","Hover the motion 2–3 times without touching, eyes on the <i>end</i> point.","Commit in one confident pass. Don’t correct or redraw."]],
  ["h","Use the right joint"],["p","Wrist for short marks, elbow for medium, <b>shoulder for long lines</b>. A wrist pivot draws an arc. With a mouse, slide your whole forearm."],
  ["warn",["Slowing down to be accurate: makes wobble.","Arcing: pivoting from the wrist or elbow.","Overshooting or stopping short: aim with your eyes, lift on the mark.","Chicken scratching: short segments instead of one stroke."]]],practice:[0,1,2,3,4,5]},
 {id:"w-curves",app:"wire",track:"curves",title:"Curves: speed is smoothness",mins:3,body:[
  ["p","Curves wobble more than lines because the hand has to change direction continuously. The fix is the same: <b>plan with ghosting, then commit at speed</b>."],
  ["ul",["Three points define a curve: start, end and the middle. Pass through the middle without slowing.","An S-curve has one direction change. Keep the transition smooth, not a kink.","Rotate the page (or tablet) so the curve sits in your natural arm swing."]],
  ["warn",["Flattening the deepest part of an arc.","A visible kink where an S-curve switches direction."]]],practice:[0,1,2,3,4]},
 {id:"w-ellipses",app:"wire",track:"ellipses",title:"Ellipses: degree, axis, and drawing through",mins:4,body:[
  ["p","An ellipse is a circle seen at an angle. Its <b>degree</b> is how open it is: 90° is a full circle, 0° a flat line. Its <b>minor axis</b> is the short line through the middle."],
  ["ul",["Draw through each ellipse <b>two times</b> (three at most) in one stroke. The extra lap evens out the shape.","Line up the long axis before you start. A tilted ellipse is the most common error.","Both ends should be equally round, never pointy."]],
  ["ex","On a cylinder, the ellipse farther from you is a little <b>more open</b> than the near one, and both minor axes line up with the cylinder’s center line."],
  ["warn",["One lap only: lumpy shapes.","Tilt: the overlay in Patterns shows if you always rotate the same way.","Too round or too narrow: watch the degree."]]],practice:[0,1,2,3,4,5]},
 {id:"w-boxes",app:"wire",track:"boxes",title:"Boxes: convergence",mins:4,body:[
  ["p","A box has three sets of four parallel edges. In perspective, each set <b>converges</b> toward its own vanishing point. They can lean toward each other, but they can <b>never spread apart</b>."],
  ["ul",["Draw through: include the hidden edges. Seeing the whole form is the point.","Each edge is a ghosted line: one confident stroke.","The back corner collects earlier errors. Plot it deliberately."]],
  ["warn",["Diverging edges (the app names which set).","Converging in pairs instead of all four toward one point.","Redrawing edges you didn’t like."]]],practice:[0,1,2,3,4]},
 {id:"w-forms",app:"wire",track:"forms",title:"Cylinders: everything together",mins:3,body:[
  ["p","A cylinder is two ellipses and two side lines. It tests every skill so far at once."],
  ["ul",["Both ellipses share a center line (the axis). Each minor axis lines up with it.","The far end is a bit rounder (higher degree).","Side lines just touch each ellipse’s outer edge, like a belt."]]],practice:[0,1,2,3]},
 {id:"w-kana",app:"wire",track:"kana",title:"Writing kana by hand",mins:3,body:[
  ["p","Stroke order and direction are part of the character, not decoration. They keep handwriting legible and fast, and they’re how look-alikes stay distinct."],
  ["ul",["General rules: top to bottom, left to right, horizontal before vertical.","シ: long stroke sweeps <b>up</b>. ツ: long stroke falls <b>down</b>.","ソ: both strokes come from the top. ン: the long stroke sweeps up.","Endings matter in neat writing: stop (とめ), flick (はね), or sweep off (はらい)."]]],practice:[0,1,2,3,4,5]},
 {id:"w-memory",app:"wire",track:"memory",title:"Drawing from memory",mins:3,body:[
  ["p","Tracing trains your hand; memory drills train your <b>eye</b>. That’s the bridge to drawing real things."],
  ["ul",["Read the big things first: overall size, angle, position.","For boxes, memorize the 8 corners, not the 12 lines.","Say it to yourself: “long line, steep, starts top left.” Words help memory."]]],practice:[0,1,2,3,4]},
 /* ---------- math ---------- */
 {id:"m-mental",app:"math",track:"mental",title:"Mental math: recall, then strategy",mins:3,body:[
  ["p","Speed comes from two places: <b>facts you recall instantly</b> (times tables) and <b>strategies</b> for everything else."],
  ["ul",["Make tens: 47 + 38 = 47 + 3 + 35 = 85.","Split: 47 × 6 = 40 × 6 + 7 × 6 = 240 + 42.","Division is a times table backwards: 56 ÷ 7 → what × 7 = 56?","Negatives: decide the sign first, then the number. Subtracting a negative adds."]],
  ["warn",["Computing a fact you should recall (the app tracks slow facts and repeats them)."]]],practice:[0,1,2,3,4,5]},
 {id:"m-fractions",app:"math",track:"fractions",title:"Fractions and percents",mins:4,body:[
  ["p","The bottom number names the <b>size of the pieces</b>; the top counts them. You can only add pieces of the same size."],
  ["ul",["Add/subtract: common denominator first, then combine the tops only.","Multiply: straight across. Divide: keep, flip, multiply.","Simplify: divide top and bottom by their greatest common factor.","Percent = per hundred. Decimal → percent: move the point two places right.","Percent change = (new − old) ÷ <b>old</b> × 100."]],
  ["ex","1/2 + 1/3 = 3/6 + 2/6 = <b>5/6</b>, not 2/5."],
  ["warn",["Adding tops and bottoms.","Forgetting to flip when dividing.","Dividing by the new value in percent change."]]],practice:[0,1,2,3,4]},
 {id:"m-equations",app:"math",track:"equations",title:"Solving linear equations",mins:4,body:[
  ["p","An equation is a balance. <b>Whatever you do to one side, do to the other.</b> Undo operations in reverse order."],
  ["ex","3x + 5 = 20 → subtract 5: 3x = 15 → divide by 3: x = 5"],
  ["ul",["Parentheses first: distribute to <i>every</i> term inside, signs included.","x on both sides: move x terms to one side; a term that crosses the equals sign flips sign.","Fractions: multiply both sides by the denominator to clear them."]],
  ["warn",["Sign slips when moving terms.","Doing an operation to one side only.","Multiplying when you should divide.","−2(x + 4) = −2x <b>− 8</b>, not + 8."]]],practice:[0,1,2,3,4]},
 {id:"m-inequalities",app:"math",track:"inequalities",title:"Inequalities: the one new rule",mins:2,body:[
  ["p","Solve exactly like an equation, with one exception: <b>multiplying or dividing both sides by a negative flips the sign.</b>"],
  ["ex","−2x + 5 > 11 → −2x > 6 → x <b>&lt;</b> −3"],
  ["warn",["Forgetting to flip.","Changing < into ≤ by accident."]]],practice:[0,1,2,3]},
 {id:"m-systems",app:"math",track:"systems",title:"Systems of equations",mins:3,body:[
  ["p","Two equations, two unknowns. The answer is the point where both lines cross."],
  ["ul",["<b>Substitution:</b> if one equation says y = …, plug that into the other.","<b>Elimination:</b> add or subtract equations so one variable cancels. Multiply first if the coefficients don’t match.","Plug the first value back in to get the second."]],
  ["warn",["Not subtracting every term (constants too).","Writing the point as (y, x)."]]],practice:[0,1,2,3]},
 {id:"m-exponents",app:"math",track:"exponents",title:"Exponents, radicals, logs",mins:4,body:[
  ["ul",["Same base: multiply → add exponents; divide → subtract; power of a power → multiply.","x⁰ = 1. x⁻ⁿ = 1/xⁿ (a reciprocal, never a negative number). x^(1/2) = √x.","Simplify √72: pull out the largest perfect square: √36 · √2 = 6√2.","log_b(n) asks: b to what power gives n? log₂ 8 = 3.","Exponential equations: match the bases, then set exponents equal. Otherwise use ln."]],
  ["warn",["(x²)³ = x⁶, not x⁵.","2⁻³ = 1/8, not −8."]]],practice:[0,1,2,3,4]},
 {id:"m-polynomials",app:"math",track:"polynomials",title:"Polynomials: expand and factor",mins:4,body:[
  ["p","Expanding multiplies out; factoring undoes it. Check any factoring by multiplying it back."],
  ["ul",["FOIL: first, outer, inner, last, then combine the middle terms.","(a + b)² = a² + 2ab + b². (a + b)(a − b) = a² − b².","Factor x² + bx + c: two numbers that multiply to c and add to b.","Always pull out the greatest common factor first.","ax² + bx + c: find two numbers that multiply to a·c and add to b; split the middle term and group."]],
  ["warn",["(x + 3)² ≠ x² + 9.","Stopping before it’s fully factored: 2x + 6 still has a 2 in it."]]],practice:[0,1,2,3,4,5,6]},
 {id:"m-quadratics",app:"math",track:"quadratics",title:"Solving quadratics",mins:3,body:[
  ["ul",["Square roots come in pairs: x² = 9 → x = ±3.","Zero product: if (x − 2)(x + 5) = 0 then x = 2 or x = −5.","Get 0 on one side, then factor. <b>Never divide by x</b>; you lose x = 0.","Quadratic formula: x = (−b ± √(b² − 4ac)) / 2a."]],
  ["warn",["(x + 3) = 0 gives x = −3, not 3.","Dividing only √ by 2a instead of the whole top."]]],practice:[0,1,2,3]},
 {id:"m-trig",app:"math",track:"trig",title:"Trig essentials",mins:4,body:[
  ["ul",["180° = π radians. Degrees → radians: × π/180.","On the unit circle, <b>cos is x, sin is y</b>, tan = y/x.","Key values: 30° → (√3/2, 1/2), 45° → (√2/2, √2/2), 60° → (1/2, √3/2).","Quadrant signs: “All Students Take Calculus”: I all positive, II sin, III tan, IV cos.","Right triangles: SOH CAH TOA."]],
  ["warn",["Swapping sin and cos.","Right size, wrong sign: check the quadrant."]]],practice:[0,1,2,3]},
 {id:"m-calculus",app:"math",track:"calculus",title:"Derivatives and integrals",mins:5,body:[
  ["p","A derivative is a rate of change; an integral reverses it."],
  ["ul",["Power rule: d/dx xⁿ = n·xⁿ⁻¹. Constants vanish. Rewrite 1/x³ as x⁻³ and √x as x^(1/2) first.","Product: (uv)′ = u′v + uv′.","Quotient: (u/v)′ = (u′v − uv′) / v².","Chain: outside′(inside) × inside′.","∫xⁿ dx = xⁿ⁺¹/(n+1) + C. ∫eˣ = eˣ, ∫cos x = sin x, ∫sin x = −cos x."]],
  ["warn",["(uv)′ ≠ u′v′.","Forgetting the inside derivative.","Integrating without dividing by the new exponent."]]],practice:[0,1,2,3,4,5,6]},
 /* ---------- IT ---------- */
 {id:"i-binary",app:"it",track:"binary",title:"Binary and hex",mins:3,body:[
  ["p","Eight bits make an octet with place values <b>128 64 32 16 8 4 2 1</b>. Each hex digit is exactly 4 bits."],
  ["ex","1010 1101 = 128 + 32 + 8 + 4 + 1 = 173 = 0xAD"],
  ["ul",["Learn 0–F as 4-bit patterns (A = 1010, F = 1111) and hex ↔ binary becomes instant.","Hex to decimal: left digit × 16 + right digit."]]],practice:[0,1,2,3,4,5]},
 {id:"i-subnet",app:"it",track:"subnet",title:"Subnetting, the fast way",mins:5,body:[
  ["p","Everything comes from the <b>interesting octet</b>: the one where the mask isn’t 255 or 0."],
  ["ul",["Mask octet values: 128 192 224 240 248 252 254 255.","Block size = 256 − the interesting mask octet.","Network address: round the IP’s interesting octet <b>down</b> to a multiple of the block size.","Broadcast = next network − 1. First host = network + 1. Last host = broadcast − 1.","Usable hosts = 2^(32 − prefix) − 2."]],
  ["ex","192.168.10.77/27 → mask .224, block 32 → network .64, broadcast .95, hosts .65–.94, 30 usable"],
  ["warn",["Forgetting −2.","Using one bit’s value for the mask (64 instead of 192).","Broadcast off by one (using the next network)."]]],practice:[0,1,2,3,4,5,6,7]},
 {id:"i-ports",app:"it",track:"ports",title:"Ports and protocols",mins:3,body:[
  ["ul",["20/21 FTP, 22 SSH, 23 Telnet, 25 SMTP, 53 DNS, 67/68 DHCP, 80 HTTP, 110 POP3, 143 IMAP, 443 HTTPS.","Next tier: 69 TFTP, 88 Kerberos, 123 NTP, 161/162 SNMP, 389 LDAP, 445 SMB, 514 Syslog, 636 LDAPS, 993 IMAPS, 995 POP3S, 3389 RDP.","Reliability needed → TCP. Small, fast or broadcast → usually UDP. DNS uses both.","Secure replacements: Telnet → SSH, HTTP → HTTPS, FTP → SFTP/FTPS, SNMPv1/2c → SNMPv3."]]],practice:[0,1,2,3,4,5,6]},
 {id:"i-perms",app:"it",track:"perms",title:"Linux permissions",mins:3,body:[
  ["ul",["r = 4, w = 2, x = 1, added per group: user, group, others.","7 rwx, 6 rw-, 5 r-x, 4 r--.","umask removes bits: files start at 666, directories at 777. umask 022 → files 644, dirs 755.","Special digit in front: setuid 4, setgid 2, sticky 1. An s or t replaces the x."]],
  ["ex","rwxr-x--- = 750 · chmod 640 = rw-r-----"]],practice:[0,1,2,3,4]},
 {id:"i-osi",app:"it",track:"osi",title:"The OSI model",mins:3,body:[
  ["p","Bottom up: <b>Physical, Data Link, Network, Transport, Session, Presentation, Application</b> (“Please Do Not Throw Sausage Pizza Away”)."],
  ["ul",["Hub 1 · switch 2 · router 3.","MAC address 2 · IP address 3 · port number 4.","PDUs: bits, frames, packets, segments/datagrams, data."]]],practice:[0,1,2,3,4]},
 /* ---------- code ---------- */
 {id:"c-read",app:"code",track:"read",title:"Reading Python like the computer",mins:4,body:[
  ["p","Tracing code line by line, keeping track of each variable, is the core debugging skill."],
  ["ul",["// floor division, % remainder, / always a float.","Indexes start at 0; slices stop before the end.","Only the first true branch of if/elif runs.","range(a, b) stops before b.","b = a shares a list; it doesn’t copy it.","print shows a value; return hands it back. No return → None."]]],practice:[0,1,2,3,4,5,6,7]},
 {id:"c-write",app:"code",track:"write",title:"Writing functions that pass tests",mins:4,body:[
  ["ul",["Return the answer, don’t print it.","Initialize before loops: 0 for sums, 1 for products, the first element for “best so far”.","Check the boundaries: < vs <=, range ends, empty input.","Read failing tests as data: the input, what you returned, what was expected."]],
  ["ex","def largest(nums):\n    best = nums[0]\n    for n in nums:\n        if n > best:\n            best = n\n    return best"]],practice:[0,1,2,3,4,5,6]},
 {id:"c-debug",app:"code",track:"debug",title:"Debugging",mins:3,body:[
  ["ul",["Read the error message first: it names the type and the line.","SyntaxError: missing colon, unmatched brackets or quotes, = vs ==.","NameError: typo or used before assignment.","Wrong answers: trace one failing test by hand.","Edge cases: empty, negative, mixed case, extra spaces."]]],practice:[0,1,2]},
 /* ---------- Japanese ---------- */
 {id:"j-hira",app:"jp",track:"hira",title:"Hiragana",mins:4,body:[
  ["p","46 basic characters, each one syllable. Learn them row by row: a, k, s, t, n, h, m, y, r, w, n."],
  ["ul",["Irregulars: し shi, ち chi, つ tsu, ふ fu, を o.","゛ voices the sound: k→g, s→z, t→d, h→b. ゜ makes h → p.","Small ゃゅょ blend: き + ゃ = kya (one beat).","Small っ doubles the next consonant: きって kitte."]],
  ["warn",["ぬ/め, ね/れ/わ, る/ろ, は/ほ, き/さ, さ/ち."]]],practice:[0,1,2,3,4,5,6,7]},
 {id:"j-kata",app:"jp",track:"kata",title:"Katakana",mins:3,body:[
  ["p","Same sounds as hiragana, sharper shapes, used mainly for foreign words: コンピューター, ネットワーク."],
  ["ul",["ー makes the previous vowel long: コーヒー koohii.","Extended sounds for loanwords: ファ fa, ティ ti, ディ di."]],
  ["warn",["シ/ツ and ソ/ン: direction of the strokes decides.","ク/タ/ケ, ウ/ワ/フ, ヌ/ス, コ/ユ."]]],practice:[0,1,2,3,4,5,6,7]},
 {id:"j-vocab",app:"jp",track:"vocab",title:"Vocabulary and spaced repetition",mins:3,body:[
  ["p","New words appear as study cards first, then get quizzed in both directions. Every correct answer pushes the next review further out."],
  ["ul",["Say words out loud when you see them; turn on Japanese audio.","Daily review is the most valuable 10 minutes in the app.","“I was right” is for genuine synonyms, not near misses."]]],practice:[0,1,2,3,4,5,6,7,8]},
 {id:"j-kanji",app:"jp",track:"kanji",title:"Kanji",mins:3,body:[
  ["p","Kanji carry meaning. Most have a native Japanese reading (kun) and Chinese-derived readings (on). 日 is ひ (sun/day) and にち (as in 毎日)."],
  ["ul",["Learn the meaning first; readings come easier attached to words.","Look for components: 休 (rest) is a person 亻 leaning on a tree 木."]]],practice:[0,1,2,3,4,5,6]},
 {id:"j-particles",app:"jp",track:"particles",title:"Particles",mins:4,body:[
  ["ul",["は topic · が subject (and question-word subjects) · を object","に destination, time, existence location, vehicle you board","で place where an action happens, or the means/tool","の of · と with/and · も also · から from · まで until"]],
  ["ex","へやに ねこが います (there’s a cat in the room) vs こうえんで あそびます (I play at the park)"],
  ["warn",["に vs で: existence vs action.","だれ/なに as subject take が.","すき and わかる take が."]]],practice:[0,1]},
 {id:"j-numbers",app:"jp",track:"numbers",title:"Numbers, time and dates",mins:4,body:[
  ["ul",["4 よん, 7 なな, 9 きゅう in most numbers.","300 さんびゃく, 600 ろっぴゃく, 800 はっぴゃく, 3000 さんぜん, 8000 はっせん.","Counts go by 10,000: 36,000 = さんまんろくせん.","Hours: 4時 よじ, 7時 しちじ, 9時 くじ.","Minutes: ぷん after 1, 3, 4, 6, 8, 10 (いっぷん, さんぷん …); ふん after 2, 5, 7, 9.","Dates: ついたち, ふつか, みっか, よっか, いつか, むいか, なのか, ようか, ここのか, とおか, じゅうよっか, はつか, にじゅうよっか."]]],practice:[0,1,2,3,4,5]}
];

  ["h","Once a week"],["ul",["Take one test in exam mode and practice its weakest section.","Skim Patterns in each trainer: which mistake keeps showing up?","Rotate subjects: two main ones, the rest in Review."]],

 {id:"x-exam",app:"hub",track:null,title:"Exam strategy",mins:3,body:[
  ["ul",["<b>First pass:</b> answer everything you know quickly; flag anything that takes more than a minute.","<b>Budget time:</b> minutes ÷ questions. Check the clock at the halfway point.","<b>Read twice:</b> watch for NOT, EXCEPT, BEST and MOST.","<b>Eliminate:</b> rule out clearly wrong answers first; it raises your odds on what’s left.","<b>Second pass:</b> go back to flagged questions with the time you saved.","<b>Change answers only for a reason,</b> like a fact you remembered, not a vague feeling."]],
  ["p","Practice this in the Tests tab: exam mode has flags, a question map and a countdown, just like the real thing."]],practice:[]},
 {id:"x-cards",app:"hub",track:null,title:"Flashcards that actually work",mins:3,body:[
  ["p","Flashcards are retrieval practice on a schedule. They work for facts (ports, terms, formulas, phrases) and pair with the trainers, which build skills."],
  ["ul",["<b>Answer before you flip.</b> Say it or think it fully, then grade.","<b>Grade honestly:</b> Again = didn’t know it, Hard = got it with effort, Good = normal, Easy = instant.","<b>One fact per card.</b> “CIA triad” beats “everything about security”.","<b>Make your own:</b> write <code>front :: back</code> lines in a note, then import that note into a custom deck."]],
  ["warn",["Hitting Good when you half-knew it: the card comes back too late and you forget it."]]],practice:[]},
 {id:"x-sidekick",app:"hub",track:null,title:"Using Sidekick as your tutor",mins:3,body:[
  ["p","In the installed app, the tutor (Ask the tutor, Explain in test reviews, Quiz me in notes) runs on your own Ollama model, so it works offline and nothing leaves your PC."],
  ["ul",["Setup is in Settings → AI tutor: Ollama address, model name, Test connection.","Ask for the <i>why</i>: “Why does dividing by a negative flip the inequality?”","Ask for a fresh example, then try it yourself before checking.","Ask it to quiz you, not to do the drill for you; the trainers only work if you do the reps."]]],practice:[]},
 {id:"k-linux",app:"cli",track:"linux",title:"Linux command line essentials",mins:5,body:[
  ["p","A command is a program name plus options (flags) plus arguments: <code>ls -la /etc</code>. Short flags can combine: <code>-l -a</code> = <code>-la</code>."],
  ["ul",["<b>Help:</b> <code>man ls</code>, <code>ls --help</code>, or tldr pages for examples.","<b>Speed:</b> Tab completes names; ↑ recalls history; Ctrl+R searches it.","<b>Pipes:</b> <code>|</code> sends output to the next command: <code>grep error app.log | wc -l</code>.","<b>Redirects:</b> <code>&gt;</code> overwrites a file, <code>&gt;&gt;</code> appends.","<b>Root:</b> prefix with <code>sudo</code> only when needed."]],
  ["ex","tail -f /var/log/syslog | grep -i error"],
  ["warn",["<code>rm -r</code> has no undo and no trash.","Forgetting <code>-r</code> when copying or deleting folders.","Using Windows commands (tracert, ipconfig) on Linux."]]],practice:[0,1,2,3,4]},
 {id:"k-win",app:"cli",track:"win",title:"Windows troubleshooting commands",mins:4,body:[
  ["ul",["<b>Network ladder:</b> <code>ipconfig /all</code> → <code>ping</code> the gateway → ping 8.8.8.8 → <code>nslookup</code> a name. Where it fails tells you the layer.","<b>DHCP:</b> <code>/release</code> then <code>/renew</code>. DNS problems: <code>/flushdns</code>.","<b>Who’s using a port:</b> <code>netstat -ano</code> gives a PID; match it in <code>tasklist</code>.","<b>Corrupt system files:</b> <code>DISM /Online /Cleanup-Image /RestoreHealth</code>, then <code>sfc /scannow</code>.","<b>PowerShell</b> uses Verb-Noun names (Get-Service, Restart-Service) and <code>Get-Help</code> for docs."]],
  ["warn",["Mixing up /release and /renew.","Running admin commands in a non-elevated window (run as administrator)."]]],practice:[0,1,2]},
 {id:"k-ios",app:"cli",track:"ios",title:"Cisco IOS workflow",mins:5,body:[
  ["p","The prompt tells you the mode: <code>R1&gt;</code> user EXEC, <code>R1#</code> privileged EXEC, <code>R1(config)#</code> global config, <code>R1(config-if)#</code> interface config."],
  ["ul",["<code>enable</code> → <code>conf t</code> → <code>int g0/1</code> → configure → <code>end</code>.","<code>?</code> lists what’s valid next. Any unique abbreviation works.","<code>no</code> in front undoes a command: <code>no shutdown</code> brings an interface up.","Run show commands from config mode with <code>do</code>: <code>do sh ip int br</code>.","Save or lose it on reboot: <code>copy run start</code> (or <code>wr</code>)."]],
  ["ex","enable\nconf t\nint g0/1\n ip address 192.168.1.1 255.255.255.0\n no shut\nend\ncopy run start"],
  ["warn",["Forgetting no shutdown.","Using a subnet mask instead of a wildcard in OSPF network statements.","Not saving the config."]]],practice:[0,1,2,3,4]},
 {id:"e-basics",app:"elec",track:"circuits",title:"Voltage, current, resistance and power",mins:5,body:[
  ["p","Think of water in a pipe: <b>voltage</b> is pressure, <b>current</b> is flow, <b>resistance</b> is how narrow the pipe is."],
  ["ex","<i>Where the analogy breaks:</i> electrons don’t get “used up” like water poured out; current flows in a complete loop, and the same current passes through every part in a series path."],
  ["ul",["Ohm’s law: <b>V = I × R</b>, so I = V/R and R = V/I.","Power: <b>P = V × I = I²R = V²/R</b>, in watts.","Units: 1 mA = 0.001 A; 1 kΩ = 1000 Ω.","A 470 Ω resistor on 5 V: I = 5/470 ≈ 10.6 mA; P = 5 × 0.0106 ≈ 53 mW (a ¼ W resistor is plenty)."]],
  ["warn",["Mixing mA and A (off by 1000).","Multiplying instead of dividing in Ohm’s law."]]],practice:[0,1,5]},
 {id:"e-parts",app:"elec",track:"circuits",title:"Resistor networks, color codes, dividers, LEDs",mins:5,body:[
  ["ul",["<b>Series:</b> add. <b>Parallel:</b> 1/R = 1/R1 + 1/R2; for two, R1R2/(R1+R2). Parallel is always less than the smallest.","<b>Color code:</b> black 0, brown 1, red 2, orange 3, yellow 4, green 5, blue 6, violet 7, grey 8, white 9. Bands 1–2 are digits, band 3 the multiplier (zeros), band 4 tolerance (gold 5%).","<b>Divider:</b> Vout = Vin × R2/(R1+R2), R2 being the bottom resistor.","<b>LED:</b> R = (Vsupply − Vf)/I. Red ≈ 2 V, blue/white ≈ 3–3.2 V, 10–20 mA typical."]],
  ["ex","Yellow, violet, red, gold = 4, 7, × 100 = 4,700 Ω = 4.7 kΩ ±5%"]],practice:[2,3,4]},
 {id:"e-bench",app:"elec",track:"bench",title:"Bench work and arcade safety",mins:5,body:[
  ["ul",["<b>Voltage:</b> meter across the part (parallel). <b>Current:</b> break the circuit and put the meter in series, on the current jack. <b>Resistance and continuity:</b> power off.","<b>JAMMA:</b> +5 V runs the logic, +12 V commonly the audio. Set +5 V measured at the board, since long wiring drops voltage.","<b>Logic gates:</b> AND both, OR either, XOR different; an N in front (NAND, NOR) inverts.","<b>ESD:</b> wear a grounded wrist strap when handling boards."]],
  ["warn",["Measuring current with the leads in parallel can blow the meter’s fuse or worse.","CRT monitors and power supplies can hold dangerous charge after unplugging. Leave CRT discharge to trained techs.","Swapping a fuse for a higher rating hides the real fault."]]],practice:[0,1]},
 {id:"t-typing",app:"typing",track:"typing",title:"Touch typing",mins:3,body:[
  ["ul",["Fingers rest on <b>ASDF</b> and <b>JKL;</b>; the bumps on F and J let you find home without looking.","Each finger owns a column. Reach, then return to home.","<b>Accuracy first:</b> speed comes from not having to fix things.","Short daily sessions beat long ones. Results show the keys you missed most.","Code and command stages train the symbols you actually use at work."]],
  ["warn",["Looking down at the keyboard.","Pushing speed while accuracy is under 96%."]]],practice:[0,1,2,3,4,5]});

  const box=$("notes"); const list=H.notes.filter(n=>(noteTag==="all"||n.tag===noteTag)&&(!noteQuery||(n.title+" "+n.body).toLowerCase().includes(noteQuery))).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.u-a.u);
  if(curNote&&!H.notes.find(n=>n.id===curNote)) curNote=null;
  box.innerHTML="<div class=\"notes\"><aside class=\"nlist\"><div class=\"nbar\"><button class=\"btn primary sm\" id=\"nNew\">New note</button><button class=\"btn sm\" id=\"nStarter\" title=\"Starter study guides\">📚 Starters</button><input id=\"nSearch\" placeholder=\"Search\" value=\""+esc(noteQuery)+"\"></div><div class=\"ntags\">"+[["all","All"],...TAGS].map(([k,v])=>"<button class=\"chip"+(noteTag===k?" on":"")+"\" data-tag=\""+k+"\">"+esc(v)+"</button>").join("")+"</div>"+
    (list.length?list.map(n=>"<button class=\"nitem"+(n.id===curNote?" on":"")+"\" data-id=\""+n.id+"\"><b>"+(n.pin?"📌 ":"")+esc(n.title||"Untitled")+"</b><small>"+esc((TAGS.find(t=>t[0]===n.tag)||["",""])[1])+" · "+ago(n.u)+"</small><span>"+esc(n.body.slice(0,80))+"</span></button>").join(""):"<p class=\"muted pad\">"+(H.notes.length?"No notes match.":"No notes yet. Tap 📚 Starters for ready-made study guides, or start your own. Notes support **bold**, *italic*, `code`, lists and # headings.")+"</p>")+"</aside><section class=\"neditor\" id=\"nEd\"></section></div>";
  box.querySelector("#nNew").addEventListener("click",()=>{ const n={id:Date.now().toString(36),title:"",body:"",tag:noteTag==="all"?"general":noteTag,c:Date.now(),u:Date.now()}; H.notes.push(n); curNote=n.id; saveHub(); renderNotes(); setTimeout(()=>$("nTitle")&&$("nTitle").focus(),0); });
  $("nStarter").addEventListener("click",()=>{ curNote=null; renderNotes(); renderStarter(); });
  const s=$("nSearch"); s.addEventListener("input",()=>{ noteQuery=s.value.toLowerCase(); const pos=s.selectionStart; renderNotes(); const s2=$("nSearch"); s2.focus(); s2.selectionStart=s2.selectionEnd=pos; });
  box.querySelectorAll("[data-tag]").forEach(b=>b.addEventListener("click",()=>{ noteTag=b.dataset.tag; renderNotes(); }));
  box.querySelectorAll(".nitem").forEach(b=>b.addEventListener("click",()=>{ curNote=b.dataset.id; renderNotes(); }));
  renderEditor();
}
let noteSaveT=null, previewOn=false;
function renderEditor(){ const ed=$("nEd"); const n=H.notes.find(x=>x.id===curNote); if(!n){ if(!H.notes.length&&typeof renderStarter==="function"){ renderStarter(); return; } ed.innerHTML="<div class=\"empty\">Pick a note or start a new one.</div>"; return; }
  ed.innerHTML="<div class=\"nhead\"><input id=\"nTitle\" placeholder=\"Title\" value=\""+esc(n.title)+"\"><select id=\"nTag\">"+TAGS.map(([k,v])=>"<option value=\""+k+"\""+(n.tag===k?" selected":"")+">"+esc(v)+"</option>").join("")+"</select></div>"+
    "<div class=\"ntools\"><button class=\"btn sm\" id=\"nPrev\">"+(previewOn?"Edit":"Preview")+"</button><button class=\"btn sm\" id=\"nPin\">"+(n.pin?"Unpin":"Pin")+"</button>"+(aiMode()?"<button class=\"btn sm\" id=\"nCards\">✨ Make flashcards</button><button class=\"btn sm\" id=\"nQuiz\">Quiz me on this</button>"+(n.tag==="design"?"<button class=\"btn sm\" id=\"nCrit\">Critique this design</button>":""):"")+"<button class=\"btn sm\" id=\"nCopy\">Copy</button><button class=\"btn sm danger\" id=\"nDel\">Delete</button><span class=\"muted small\" id=\"nSaved\">Saved</span></div>"+
    (previewOn?"<div class=\"mdview\">"+(md(n.body)||"<p class=\"muted\">Nothing yet.</p>")+"</div>":"<textarea id=\"nBody\" placeholder=\"Write in your own words. Try: plain version, precise terms, where it breaks, one example.\">"+esc(n.body)+"</textarea>")+"<div class=\"aiout\" id=\"nAi\"></div>";
  const save=()=>{ n.u=Date.now(); $("nSaved").textContent="Saving…"; clearTimeout(noteSaveT); noteSaveT=setTimeout(()=>{ saveHub(); const s=$("nSaved"); if(s) s.textContent="Saved"; },500); };
  $("nTitle").addEventListener("input",e=>{ n.title=e.target.value; save(); }); $("nTag").addEventListener("change",e=>{ n.tag=e.target.value; save(); renderNotes(); });
  if($("nBody")) $("nBody").addEventListener("input",e=>{ n.body=e.target.value; save(); });
  $("nPrev").addEventListener("click",()=>{ previewOn=!previewOn; renderEditor(); }); $("nPin").addEventListener("click",()=>{ n.pin=!n.pin; save(); renderNotes(); });
  $("nCopy").addEventListener("click",()=>{ navigator.clipboard&&navigator.clipboard.writeText("# "+n.title+"\n\n"+n.body).then(()=>toast("Copied as Markdown."),()=>toast("Couldn’t copy.")); });
  $("nDel").addEventListener("click",()=>{ if(!confirm("Delete this note?")) return; H.notes=H.notes.filter(x=>x.id!==n.id); curNote=null; saveHub(); renderNotes(); });
  if($("nCards")) $("nCards").addEventListener("click",()=>{ if(!n.body.trim()){ toast("Write some notes first."); return; } cardsFromNote(n); });
  if($("nCrit")) $("nCrit").addEventListener("click",async()=>{ const out=$("nAi"); out.textContent="Reading your design…"; try { await aiAsk("You are a senior game designer mentoring a beginner. Critique this one-page game design. Cover: is the core loop clear and likely fun on its own; are there interesting decisions; is the scope realistic for one person; the single biggest risk and a quick way to playtest it. Then suggest the smallest prototype to build first. Plain text, no markdown, under 220 words.\n\n"+n.title+"\n"+n.body, t=>{ out.textContent=t; }); } catch(e){ out.textContent=e.message; } });
  if($("nQuiz")) $("nQuiz").addEventListener("click",async()=>{ const out=$("nAi"); out.textContent="Writing questions…"; try { await aiAsk("Write 4 short self-quiz questions (with answers after each, on a new line starting with 'Answer:') that test understanding of these study notes, including one question about where an analogy breaks down if there is an analogy. Plain text, no markdown.\n\nNotes titled \""+n.title+"\":\n"+n.body, t=>{ out.textContent=t; }); } catch(e){ out.textContent=e.message; } });
}
function openQuickNote(title,tag){ const n={id:Date.now().toString(36),title:title||"",body:"",tag:tag||"general",c:Date.now(),u:Date.now()}; H.notes.push(n); saveHub(); curNote=n.id; previewOn=false; noteTag="all"; location.hash="notes"; renderNotes(); setTimeout(()=>{ const b=$("nBody"); if(b) b.focus(); },50); }

let linkTag="all";

  const list=all.filter(r=>linkTag==="all"||r.tag===linkTag);

/* ================= focus timer ================= */
let focus={ phase:"focus", left:0, running:false, t:null };
function resetFocus(){ focus.phase="focus"; focus.left=H.settings.focusMin*60; focus.running=false; clearInterval(focus.t); drawFocus(); }
function drawFocus(){ const b=$("focusBtn"); b.textContent=(focus.phase==="focus"?"🎯 ":"☕ ")+fmtT(focus.left); b.classList.toggle("running",focus.running); b.title=focus.running?"Pause":"Start a "+(focus.phase==="focus"?"focus":"break")+" timer"; }
$("focusBtn").addEventListener("click",()=>{ ensureAudio(); focus.running=!focus.running; clearInterval(focus.t);
  if(focus.running) focus.t=setInterval(()=>{ focus.left--; if(focus.left<=0){ chime(); const was=focus.phase; focus.phase=was==="focus"?"break":"focus"; focus.left=(focus.phase==="focus"?H.settings.focusMin:H.settings.breakMin)*60; toast(was==="focus"?"Focus block done. Take a "+H.settings.breakMin+"-minute break.":"Break’s over. Back to it.",5000); } drawFocus(); },1000);
  drawFocus(); });
$("focusReset").addEventListener("click",resetFocus);

/* ================= native trainers: command line, electronics, typing ================= */
const ri=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
/* ---------- command line ---------- */
function cliNorm(s,mode){ s=String(s).replace(/[“”]/g,"\"").replace(/[‘’]/g,"'").trim();
  s=s.replace(/^(\$|#|>|PS [^>]*>|[A-Za-z0-9_-]+(\([a-z-]+\))?[#>])\s+/,""); s=s.replace(/\s+/g," ").trim();
  if(mode!=="linux") s=s.toLowerCase();
  s=s.replace(/(["'])([^"'\s]+)\1/g,"$2");
  if(mode==="ios") s=s.replace(/\b(gigabitethernet|gig|gi|g)\s*(\d)/g,"g$2").replace(/\b(fastethernet|fa|f)\s*(\d)/g,"f$2").replace(/\b(serial|se|s)\s*(\d\/)/g,"s$2");
  return s; }
function cliMatch(ans,pat,mode){ const A=cliNorm(ans,mode).split(" "), Pp=pat.split(" ").map(t=>/^\{-?\/?\w+\}$/.test(t)?t:cliNorm(t,mode)); let i=0;
  for(const t of Pp){ const m=t.match(/^\{(-|\/)?(\w+)\}$/);
    if(m){ const want=new Set(m[2].split("")), got=new Set(); let n=0; while(i<A.length&&/^[-\/][A-Za-z]+$/.test(A[i])){ A[i].slice(1).split("").forEach(c=>got.add(c)); i++; n++; } if(!n||got.size!==want.size||[...want].some(c=>!got.has(c))) return false; }
    else { if(A[i]!==t) return false; i++; } }
  return i===A.length; }
const showPat=p=>p.replace(/\{(-|\/)?(\w+)\}/g,(m,a,b)=>(a||"-")+b);
function cliQ(mode,item){ const [prompt,pats,wrong]=item, all=CLI[mode].flatMap(s=>s.items);
  return { key:"cli:"+mode+":"+prompt, html:"<div class=\"cliq\">"+esc(prompt)+"</div><div class=\"clienv\">"+({linux:"Linux shell",win:"Windows Command Prompt / PowerShell",ios:"Cisco IOS"})[mode]+"</div>", answer:showPat(pats[0]), fmt:"Type the command.", mono:true,
    autoOk:raw=>pats.some(p=>cliMatch(raw,p,mode)),
    check(raw){ if(!String(raw).trim()) return {invalid:"Type a command."}; if(pats.some(p=>cliMatch(raw,p,mode))) return {ok:true};
      const n=cliNorm(raw,mode); if(wrong) for(const [w,msg] of Object.entries(wrong)){ if(cliNorm(w,mode)===n) return {ok:false,type:"cmdmix",msg}; }
      const o=all.find(it=>it!==item&&it[1].some(p=>cliMatch(raw,p,mode))); if(o) return {ok:false,type:"cmdmix",msg:"That command would: "+o[0].charAt(0).toLowerCase()+o[0].slice(1)+"."};
      const first=n.split(" ")[0], want=cliNorm(showPat(pats[0]),mode).split(" ")[0];
      if(first===want) return {ok:false,type:"cmdargs",msg:"Right command, but the options or arguments are off."};
      return {ok:false,type:"cmdwrong",msg:"Not quite."}; } }; }

const PFX={p:1e-12,n:1e-9,u:1e-6,"µ":1e-6,m:1e-3,k:1e3,K:1e3,M:1e6,G:1e9};
function parseVal(raw){ let s=String(raw).trim().replace(/,/g,"").replace(/\s+/g,"").replace(/(ohms?|Ω|hz|v|a|w|f)$/i,"");
  let m=s.match(/^(-?\d*\.?\d+)([pnuµmkKMG]?)$/); if(m) return {v:parseFloat(m[1])*(m[2]?PFX[m[2]]:1),pfx:!!m[2]};
  m=s.match(/^(\d+)([kKMR])(\d+)$/); if(m) return {v:parseFloat(m[1]+"."+m[3])*(m[2]==="R"?1:PFX[m[2]]),pfx:true}; return null; }
function eng(v,unit){ if(v===0) return "0 "+unit; const a=Math.abs(v); const P=[[1e9,"G"],[1e6,"M"],[1e3,"k"],[1,""],[1e-3,"m"],[1e-6,"µ"],[1e-9,"n"],[1e-12,"p"]]; const [s,p]=P.find(([s])=>a>=s*0.9995)||[1e-12,"p"]; return (+(v/s).toPrecision(3))+" "+p+unit; }
const near=(a,b,t)=>Math.abs(a-b)<=(t||0.015)*Math.max(Math.abs(b),1e-15);
const E12=[1,1.2,1.5,1.8,2.2,2.7,3.3,3.9,4.7,5.6,6.8,8.2];
const rR=(lo,hi)=>{ let v; do { v=E12[ri(0,11)]*Math.pow(10,ri(lo,hi)); } while(false); return +v.toPrecision(2); };
function valQ(key,html,want,unit,scale,fmt,diags){ return { key, html, answer:eng(want,unit), fmt:fmt||("Number in "+eng(scale,unit).replace(/^1 /,"")+", or with a prefix like 4.7k or 25m."), mono:false,
  check(raw){ const p=parseVal(raw); if(!p) return {invalid:"Type a number, optionally with a prefix (k, m, µ…)."}; const v=p.pfx?p.v:p.v*scale; if(near(v,want)) return {ok:true};
    for(const [x,type,msg] of (diags||[])){ if(near(v,x)) return {ok:false,type,msg}; }
    if(near(v,want*1000)||near(v,want/1000)) return {ok:false,type:"units",msg:"Off by a factor of 1000. Check your prefixes (m, k) and which unit was asked for."};
    return {ok:false,type:"calc",msg:"Not quite. Recheck the formula."}; } }; }
function ohmQ(){ const V=[3.3,5,9,12,24][ri(0,4)], R=rR(2,4), I=V/R, k=ri(0,2);
  if(k===0) return valQ("ohm:I",V+" V across "+eng(R,"Ω")+". Current?",I,"A",1e-3,"Number in mA (or with a unit, like 0.012A).",[[V*R,"ohmmul","Current is V ÷ R, not V × R."],[R/V,"ohminv","Upside down: I = V ÷ R."]]);
  if(k===1) return valQ("ohm:V",eng(I,"A")+" through "+eng(R,"Ω")+". Voltage across it?",V,"V",1,"Number in volts.",[[I/R,"ohminv","V = I × R."],[R/I,"ohminv","V = I × R."]]);

  if(k===1){ const I=[0.01,0.02,0.05,0.1][ri(0,3)], R=rR(1,3), P=I*I*R, [s,f]=sc(P); return valQ("pw:I2R",eng(I,"A")+" flows through "+eng(R,"Ω")+". Power in the resistor?",P,"W",s,f,[[I*R,"powsq","That’s the voltage (I × R). Power is I² × R."]]); }
  const V=[3.3,5,9,12][ri(0,3)], R=rR(2,3), P=V*V/R, [s,f]=sc(P); return valQ("pw:V2R",V+" V across "+eng(R,"Ω")+". Power?",P,"W",s,f,[[V/R,"powsq","That’s the current. Power is V² ÷ R."]]); }
function serParQ(){ const k=ri(0,3);
  if(k===0){ const rs=[rR(1,3),rR(1,3),ri(0,1)?rR(1,3):null].filter(Boolean); const S=rs.reduce((a,b)=>a+b,0), Pp=1/rs.reduce((a,b)=>a+1/b,0);
