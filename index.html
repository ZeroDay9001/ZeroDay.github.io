  Object.keys(QAPPS).forEach(a=>{ h+="<div class=\"preset\"><div class=\"ph\"><span class=\"pic\">"+APPS[a].icon+"</span><b>"+esc(APPS[a].name)+"</b></div><div class=\"plt\">"+QAPPS[a].map(tr=>"<label class=\"chk\"><input type=\"checkbox\" checked data-pa=\""+a+"\" data-ptr=\""+tr+"\"> "+esc(APPS[a].tracks[tr][0])+"</label>").join("")+"</div><small>"+(H.placed[a]?"Placed "+ago(H.placed[a]):"Not placed yet")+"</small><div class=\"pb\"><button class=\"btn primary sm\" data-place=\""+a+"\">Start</button></div></div>"; });
  h+="</div><p class=\"muted small\">Drawing and Typing don’t have text placement tests. Use test-outs there: click a locked stage and pass it 3 times in a row.</p>";
  box.innerHTML=h; box.querySelectorAll("[data-place]").forEach(b=>b.addEventListener("click",()=>{ const a=b.dataset.place; const trs=[...box.querySelectorAll("[data-pa=\""+a+"\"]:checked")].map(c=>c.dataset.ptr); if(!trs.length){ toast("Pick at least one track."); return; } startPlacement(a,trs); })); }
function startPlacement(a,trs){ PL={a,trs,ti:0,stage:0,inStage:0,right:0,asked:0,results:{},running:true}; trs.forEach(t=>PL.results[t]={passed:-1,set:[]}); nextPlQ(); }
async function nextPlQ(){ const tr=PL.trs[PL.ti]; if(!tr){ finishPlacement(); return; } const st=stagesFor(PL.a,tr);
  if(PL.stage>=st.length){ PL.ti++; PL.stage=0; PL.inStage=0; PL.right=0; nextPlQ(); return; }
  $("placement").innerHTML="<div class=\"loading\">Loading…</div>";
  try { PL.q=await makeQ(PL.a,tr,st[PL.stage]); } catch(e){ $("placement").innerHTML="<p>Couldn’t load questions for this subject. Check your connection and reload.</p>"; PL.running=false; return; }
  PL.ans=""; renderPlQ(); }
function renderPlQ(){ const q=PL.q, tr=PL.trs[PL.ti], box=$("placement"); PL.asked++;
  box.innerHTML="<div class=\"exam\"><div class=\"exhead\"><b>"+APPS[PL.a].icon+" Placement: "+esc(APPS[PL.a].name)+"</b><span class=\"muted\">"+esc(APPS[PL.a].tracks[tr][0])+" · stage "+(PL.stage+1)+" of "+stagesFor(PL.a,tr).length+"</span><span class=\"exprog\">track "+(PL.ti+1)+" / "+PL.trs.length+"</span><button class=\"btn sm\" id=\"plQuit\">Stop</button></div>"+
    "<div class=\"exq\"><div class=\"qh\">"+q.html+"</div>"+(q.opts?"<div class=\"nopts\">"+q.opts.map((o,k)=>"<button class=\"opt\" data-po=\""+o.i+"\"><span class=\"ok\">"+(k+1)+"</span>"+esc(o.t)+"</button>").join("")+"</div>":"<input id=\"plA\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\"><div class=\"pv\" id=\"plPv\" lang=\"ja\"></div>")+"<div class=\"small muted\">"+esc(q.fmt||"")+"</div><div class=\"brow\" style=\"justify-content:center\">"+(q.opts?"":"<button class=\"btn primary\" id=\"plGo\">Submit</button>")+"<button class=\"btn\" id=\"plIdk\">I don’t know</button></div><div id=\"plFb\" class=\"exfb\"></div></div></div>";
  const answer=raw=>{ let r; try { r=q.check(raw); } catch(e){ r={ok:false}; } if(r.invalid){ $("plFb").className="exfb warn"; $("plFb").textContent=r.invalid; PL.asked--; return; } plResult(!!r.ok); };
  $("plQuit").addEventListener("click",()=>{ if(confirm("Stop and apply what’s been placed so far?")) finishPlacement(); });
  $("plIdk").addEventListener("click",()=>plResult(false));
  if(q.opts) box.querySelectorAll("[data-po]").forEach(b=>b.addEventListener("click",()=>answer(b.dataset.po)));
  else { const inp=$("plA"); inp.focus(); inp.addEventListener("input",()=>{ if(q.romaji&&api("jp")){ const v=inp.value.trim(); $("plPv").textContent=v&&/[a-z]/i.test(v)?api("jp").toHiraRomaji(v):""; } }); inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&inp.value.trim()) answer(inp.value); }); $("plGo").addEventListener("click",()=>{ if(inp.value.trim()) answer(inp.value); }); } }
function plResult(ok){ const tr=PL.trs[PL.ti];
  if(INDEP[PL.a]){ if(!ok){ PL.stage++; PL.inStage=0; nextPlQ(); return; } PL.inStage++; if(PL.inStage>=2){ PL.results[tr].set.push(PL.stage); PL.stage++; PL.inStage=0; } nextPlQ(); return; }
  if(!ok){ PL.ti++; PL.stage=0; PL.inStage=0; nextPlQ(); return; }
  PL.inStage++; if(PL.inStage>=2){ PL.results[tr].passed=PL.stage; PL.stage++; PL.inStage=0; } nextPlQ(); }
function finishPlacement(){ PL.running=false; const a=PL.a, res=PL.results; let changed=0; const lines=[];
  const apply=d=>{ Object.entries(res).forEach(([tr,r])=>{ const max=stagesFor(a,tr).length;
    if(INDEP[a]){ d.prog.cleared=d.prog.cleared||{}; d.prog.unlocked=d.prog.unlocked||{}; d.settings=d.settings||{}; d.settings.stage=d.settings.stage||{};
      r.set.forEach(j=>{ if(!d.prog.cleared[tr+":"+j]){ d.prog.cleared[tr+":"+j]=true; changed++; H.sr[a+"|"+tr+"|"+j]={n:0,due:Date.now()+3*DAY,last:Date.now()}; } });
      const first=stagesFor(a,tr).find(j=>!r.set.includes(j)); const top=r.set.length?Math.min(Math.max(...r.set)+1,max-1):0; d.prog.unlocked[tr]=Math.max(d.prog.unlocked[tr]||0,top,first!=null?first:0); d.settings.stage[tr]=first!=null?first:max-1;
      lines.push(APPS[a].tracks[tr][0]+": passed "+r.set.length+" of "+max+" topics"+(first!=null?", starting with “"+APPS[a].tracks[tr][1][first]+"”":"")); return; }
    const n=r.passed+1; if(n<=0){ lines.push(APPS[a].tracks[tr][0]+": start at stage 1"); return; }
    d.prog.cleared=d.prog.cleared||{}; d.prog.unlocked=d.prog.unlocked||{}; d.settings=d.settings||{}; d.settings.stage=d.settings.stage||{};
    for(let j=0;j<n;j++){ if(!d.prog.cleared[tr+":"+j]){ d.prog.cleared[tr+":"+j]=true; changed++; H.sr[a+"|"+tr+"|"+j]={n:0,due:Date.now()+3*DAY,last:Date.now()}; } }
    const start=Math.min(n,max-1); d.prog.unlocked[tr]=Math.max(d.prog.unlocked[tr]||0,start); d.settings.stage[tr]=start; if(a!=="wire"&&!d.settings.track) d.settings.track=tr;
    lines.push(APPS[a].tracks[tr][0]+": "+(n>=max?"all "+max+" stages placed out":n+" stage"+(n===1?"":"s")+" placed out, starting at “"+APPS[a].tracks[tr][1][start]+"”")); }); };
  if(APPS[a].native){ apply(natData(a)); saveHub(); }
  else { let d=readApp(a)||{}; d.settings=d.settings||{}; d.prog=d.prog||{}; d.history=d.history||[]; apply(d); try { localStorage.setItem(APPS[a].ls,JSON.stringify(d)); } catch(e){} }
  H.placed[a]=Date.now(); saveHub();
  const needReload=!APPS[a].native&&mounted[a];
  $("placement").innerHTML="<div class=\"results\"><div class=\"rtop\"><div class=\"big\">✓</div><div><b>Placement done: "+esc(APPS[a].name)+"</b><p class=\"muted\">"+changed+" stage"+(changed===1?"":"s")+" marked cleared. They’ll come back in spaced reviews in 3 days to confirm they stick.</p></div></div><ul class=\"tips\">"+lines.map(l=>"<li>"+esc(l)+"</li>").join("")+"</ul><div class=\"rbtns\">"+(needReload?"<button class=\"btn primary\" id=\"plReload\">Apply and reload</button>":"<button class=\"btn primary\" id=\"plOpen\">Start practicing</button>")+"<button class=\"btn\" id=\"plBack\">Other subjects</button></div>"+(needReload?"<p class=\"muted small\">That trainer is already open, so the page reloads to pick up your new starting points.</p>":"")+"</div>";
  if($("plReload")) $("plReload").addEventListener("click",()=>{ location.hash=APPS[a].route; location.reload(); });
  if($("plOpen")) $("plOpen").addEventListener("click",()=>openTrainer(a));
  $("plBack").addEventListener("click",()=>{ PL=null; renderPlacement(); }); }

async function renderPretest(g){ const box=$("pretest"); if(!box) return; if(!H.settings.pretest||!QAPPS[g.app]||!g.practice.length){ box.remove(); return; }
  const sts=g.practice.slice(0,2); const qs=[]; for(const st of sts){ try { qs.push(await makeQ(g.app,g.track,st)); } catch(e){} } if(!qs.length){ box.remove(); return; }
  box.innerHTML="<h3>Before you read: 2 quick questions</h3><p class=\"muted small\">Guess if you don’t know. Trying first makes the reading stick better, even when the guess is wrong (the pretesting effect).</p>"+qs.map((q,i)=>"<div class=\"ptq\" id=\"ptq"+i+"\"><div class=\"ptqh\">"+q.html+"</div>"+(q.opts?"<div class=\"nopts\">"+q.opts.map((o,k)=>"<button class=\"opt\" data-pt=\""+i+"\" data-pv=\""+o.i+"\"><span class=\"ok\">"+(k+1)+"</span>"+esc(o.t)+"</button>").join("")+"</div>":"<div class=\"askrow\"><input data-pin=\""+i+"\" placeholder=\"Your guess\" autocomplete=\"off\" autocapitalize=\"off\"><button class=\"btn\" data-pgo=\""+i+"\">Check</button></div>")+"<div class=\"exfb\" id=\"ptf"+i+"\"></div></div>").join("");
  const show=(i,raw)=>{ const q=qs[i]; let r; try { r=q.check(raw); } catch(e){ r={ok:false}; } if(r.invalid){ $("ptf"+i).className="exfb warn"; $("ptf"+i).textContent=r.invalid; return; } $("ptf"+i).className="exfb "+(r.ok?"good":"bad"); $("ptf"+i).innerHTML=r.ok?"Correct. The guide explains why.":"Answer: <b>"+q.answer+"</b>. Now read on to see why."; };
  box.querySelectorAll("[data-pv]").forEach(b=>b.addEventListener("click",()=>show(+b.dataset.pt,b.dataset.pv)));
  box.querySelectorAll("[data-pgo]").forEach(b=>b.addEventListener("click",()=>{ const inp=box.querySelector("[data-pin=\""+b.dataset.pgo+"\"]"); if(inp.value.trim()) show(+b.dataset.pgo,inp.value); }));
  box.querySelectorAll("[data-pin]").forEach(inp=>inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&inp.value.trim()) show(+inp.dataset.pin,inp.value); })); }

  if($("mxClear")) $("mxClear").addEventListener("click",()=>{ H.mistakes=H.mistakes.filter(m=>!m.fixed); saveHub(); renderMistakes(); toast("Removed skills you’ve since answered correctly in a retest."); }); }

let LB=null;
const labCondName={read:"Read it twice",listen:"Hear it and read it",aloud:"Say it out loud",test:"Quiz yourself"};
const labCondWhy={read:"Rereading feels productive but is usually the weakest method.",listen:"Adds sound to the text (two channels at once).",aloud:"Saying words aloud tends to beat silent reading (the production effect).",test:"Retrieval practice: trying to recall, then checking."};
function labNorm(s){ return String(s).toLowerCase().replace(/[^a-z ]/g," ").replace(/^\s*(a|an|the|to)\s+/,"").replace(/\s+/g," ").trim(); }
function labOk(w,raw){ const u=labNorm(raw); return !!u&&w[2].some(m=>labNorm(m)===u); }
function renderLab(){ const box=$("lab"), L=H.lab, cur=L.cur;
  if(LB){ renderLabStep(); return; }
  let h="<h2>Learning lab</h2><p class=\"muted\">Find out which study method actually works best <i>for you</i>, measured instead of guessed. You learn about 20 new Japanese words with three different methods, then a day later you’re tested on all of them. The method behind the most remembered words wins. There are "+LAB_SETS.length+" word sets; every run is added to your combined result.</p>";
  h+="<section class=\"card\"><h3>Why a test instead of a quiz about your style</h3><p>Matching lessons to a self-reported “learning style” (visual, auditory and so on) has been tested many times and doesn’t improve learning. People’s feelings about what works are also unreliable: easy methods like rereading <i>feel</i> best while effortful ones like self-testing work better. So this lab measures what you actually remember a day later.</p></section>";
  if(cur&&cur.stage==="wait"){ const left=cur.learnedAt+20*3600000-Date.now();
    h+="<section class=\"card\"><h3>Run in progress: "+esc(LAB_SETS.find(s=>s.id===cur.set).name)+"</h3><p>You studied "+cur.words.length+" words "+ago(cur.learnedAt)+". "+(left>0?"The memory test unlocks in about "+Math.ceil(left/3600000)+" h. Waiting matters: an immediate test mostly measures short-term memory, which is exactly what fools people about rereading.":"The memory test is ready.")+"</p><div class=\"brow\"><button class=\"btn primary\" id=\"lbTest\""+(left>0?" disabled":"")+">Take the memory test</button>"+(left>0?"<button class=\"btn\" id=\"lbEarly\">Test now anyway (less accurate)</button>":"")+"<button class=\"btn danger\" id=\"lbAbort\">Cancel run</button></div></section>"; }
  else { const sets=LAB_SETS.filter(s=>!L.runs.some(r=>r.set===s.id));
    h+="<section class=\"card\"><h3>Start a run</h3><p class=\"muted\">About 10 minutes now, 5 minutes tomorrow. Methods: "+["read",jaVoiceHub()?"listen":"aloud","test"].map(c=>"<b>"+labCondName[c]+"</b>").join(", ")+".</p>"+(sets.length?sets.map(s=>"<button class=\"btn primary\" data-lbset=\""+s.id+"\">Start: "+esc(s.name)+"</button> ").join(""):"<p>You’ve used both word sets. Results below.</p>")+"</section>"; }

  if($("lbTest")) $("lbTest").addEventListener("click",()=>labDelayed());

  if($("lbAbort")) $("lbAbort").addEventListener("click",()=>{ if(confirm("Cancel this run?")){ delete H.lab.cur; saveHub(); renderLab(); } }); }
try { speechSynthesis.getVoices(); speechSynthesis.addEventListener("voiceschanged",()=>{ if(view==="lab"&&!LB) renderLab(); }); } catch(e){}
function jaVoiceHub(){ try { return speechSynthesis.getVoices().some(v=>/^ja/i.test(v.lang)); } catch(e){ return false; } }
function sayJa(t){ try { const v=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang)); if(!v) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.voice=v; u.lang=v.lang; u.rate=0.85; speechSynthesis.speak(u); } catch(e){} }
function labStart(setId){ const set=LAB_SETS.find(s=>s.id===setId); const ws=set.words.slice(); for(let i=ws.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ws[i],ws[j]]=[ws[j],ws[i]]; }
  LB={phase:"pre",set:setId,words:ws,i:0,known:[]}; renderLabStep(); }
function renderLabStep(){ const box=$("lab");

    box.innerHTML="<div class=\"exam\"><div class=\"exhead\"><b>Step 1 of 3: what do you already know?</b><span class=\"exprog\">"+(LB.i+1)+" / "+LB.words.length+"</span></div><div class=\"exq\"><p class=\"muted\">Type the meaning only if you’re sure. Words you know are left out so they don’t skew the result.</p><div class=\"qh\"><span class=\"jp\" lang=\"ja\" style=\"font-size:2.4em\">"+w[0]+"</span></div><input id=\"lbA\" placeholder=\"English meaning\" autocomplete=\"off\"><div class=\"brow\" style=\"justify-content:center\"><button class=\"btn primary\" id=\"lbGo\">Check</button><button class=\"btn\" id=\"lbNo\">Don’t know</button></div></div></div>";

    const inp=$("lbA"); inp.focus(); const go=v=>{ LB.answers.push({w:w[0],ok:labOk(w,v)}); LB.i++; renderLabStep(); };
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(inp.value); }); $("lbGo").addEventListener("click",()=>go(inp.value)); $("lbNo").addEventListener("click",()=>go("")); } }
function labAssign(){ const rest=LB.words.filter(w=>!LB.known.includes(w[0])); const conds=["read",jaVoiceHub()?"listen":"aloud","test"]; for(let i=rest.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [rest[i],rest[j]]=[rest[j],rest[i]]; }
  if(rest.length<9){ $("lab").innerHTML="<div class=\"results\"><b>You already know most of these words.</b><p class=\"muted\">With fewer than 9 new words the comparison wouldn’t mean much. Try the other word set.</p><button class=\"btn primary\" id=\"lbBack\">Back</button></div>"; $("lbBack").addEventListener("click",()=>{ LB=null; renderLab(); }); return; }

    const t=$("lbT"); requestAnimationFrame(()=>{ t.style.transition="width 5s linear"; t.style.width="100%"; }); clearTimeout(LB.timer); LB.timer=setTimeout(()=>{ LB.k++; labStudyNext(); },5000); return; }

  const w=Q.queue.shift(); if(!w){ LB.bi++; LB.intro=true; LB.q=null; renderLabStep(); return; }

GUIDES.unshift({id:"x-evidence",app:"hub",track:null,title:"What the research says (and what it doesn’t)",mins:6,body:[
  ["p","Everything in this app is meant to be backed by learning research. Here’s what each feature rests on, how strong the evidence is, and what was left out on purpose."],
  ["h","Strong evidence: built in"],
  ["ul",["<b>Retrieval practice</b> (every round, test and flashcard): recalling beats rereading by a wide margin in hundreds of studies.","<b>Spacing / successive relearning</b> (Spaced reviews, Daily review, flashcards): reviewing at growing intervals greatly improves long-term retention.","<b>Immediate, specific feedback</b> (the buzz, the named mistake): feedback about the task helps; feedback about the person can hurt.","<b>Mastery learning, spaced</b> (3 passes in a row to unlock, plus one pass on a later visit to clear): moving on after mastery improves outcomes, and spreading the confirming pass across days beats piling more repetitions into one sitting.","<b>Interleaving</b> (Interleaved practice, Review, Mixed stages): mixing problem types teaches you to choose the right method, especially in math."]],
  ["h","Good evidence: built in"],
  ["ul",["<b>Pretesting</b> (2 questions before each guide): attempting answers before learning improves learning from what follows, even when you guess wrong.","<b>Worked examples for beginners</b> (guide examples, worked solutions): best early on; less useful once you’re skilled (the expertise reversal effect), which is why placement tests skip you ahead.","<b>Confidence ratings</b> (tests): judging your certainty improves self-monitoring, and confident errors are remembered best once corrected (the hypercorrection effect).","<b>Elaboration</b> (Ask the tutor, notes in your own words with “where it breaks”): explaining why something is true helps it stick.","<b>Fluency practice</b> (speed targets): automatic basics free up attention for harder problems, so speed targets are kept only on recall drills like kana, times tables, ports and commands. Reasoning stages (Security+, troubleshooting, reading code, circuit calculations) have no time limit, since time pressure there encourages guessing."]],
  ["h","Not proven: left out or downplayed"],
  ["ul",["<b>Matching “learning styles.”</b> Repeatedly tested; no benefit. The Learning lab measures what works for you instead.","<b>Rereading and highlighting.</b> Feel productive, work poorly. Guides are short and paired with practice for that reason.","<b>XP, leaderboards, badges.</b> Can motivate briefly but don’t improve learning, and rewards can crowd out interest. Achievements here are a small extra, not the point.","<b>Typing flashcard answers instead of thinking them.</b> Studies find silent recall works about as well, so flashcards let you grade yourself."]],
  ["h","Neutral but useful"],
  ["ul",["<b>Focus timer:</b> breaks help attention, but timer schedules themselves aren’t magic.","<b>Streaks and heatmaps:</b> good for habit tracking; they don’t teach anything by themselves.","<b>Sleep:</b> memory consolidates during sleep, so short daily sessions beat one long night."]]],practice:[]});

  if(k===0){ const p=pick([1,2,3,5,10]), n=pick([10,20,30,50]); const P=100*(1-Math.pow(1-p/100,n)); return numQ2("gm:one","A drop has a "+p+"% chance per try. Chance of getting at least one in "+n+" tries? (%)",P,0.3,"A percentage, like 64.2.",[[Math.min(100,p*n),"probadd","Adding chances overcounts. Use 1 − (1 − p)ⁿ: the chance of not missing every time."]],pct(P)+"%"); }
  if(k===1){ const p=pick([1,2,4,5,10,20]); return numQ2("gm:exp","A drop has a "+p+"% chance per try. Average number of tries to get it?",100/p,0.5,"A number.",[[p,"probexp","On average it takes 1 ÷ p tries: 1 ÷ "+p/100+"."]],String(100/p)); }
  const d=pick([[2,6,7,6/36],[2,6,"doubles",6/36],[2,6,"at least one 6",11/36],[2,6,"two 6s",1/36],[2,6,"10 or more",6/36]]); const want=d[3]*100;
  return numQ2("gm:dice","Roll two six-sided dice. Chance of "+(d[2]===7?"a sum of 7":d[2])+"? (%)",want,0.3,"A percentage.",d[2]==="at least one 6"?[[100*2/6,"probadd","Adding 1/6 + 1/6 double-counts rolling two 6s: 1 − (5/6)² = 11/36."]]:[],pct(want)+"%"); }
function gmEV(){ if(Math.random()<0.5){ const p=pick([0.6,1,1.6,2]), N=pick([50,80,90]); const want=100*Math.pow(1-p/100,N-1);
    return numQ2("gm:pity","Base rate "+p+"% per pull, guaranteed on pull "+N+". Chance you miss all "+(N-1)+" pulls before it and reach the guarantee? (%)",want,0.4,"A percentage.",[[100-p*(N-1),"probadd","Use (1 − p)ⁿ for missing n times in a row, not 1 − n × p."]],pct(want)+"%"); }
  const items=[["Common",pick([60,70]),ri(1,5)],["Rare",0,ri(10,30)],["Epic",pick([5,10]),ri(50,120)]]; items[1][1]=100-items[0][1]-items[2][1]; const ev=items.reduce((s,i)=>s+i[1]/100*i[2],0), plain=items.reduce((s,i)=>s+i[2],0)/3;
  return numQ2("gm:ev","Loot table: "+items.map(i=>i[0]+" "+i[1]+"% worth "+i[2]+" gold").join(", ")+". Expected value of one roll (gold)?",ev,0.05,"A number.",[[plain,"evavg","Weight each value by its chance: Σ (probability × value)."]],String(+ev.toFixed(2))); }
function gmDmg(){ if(Math.random()<0.5){ const B=ri(10,40)*10, c=pick([20,30,50,60]), d=pick([50,100,150]); const want=B*(1+c/100*d/100);
    return numQ2("gm:crit","Hit for "+B+" damage, "+c+"% crit rate, +"+d+"% crit damage. Average damage per hit?",want,0.5,"A number.",[[B*(1+c/100)*(1+d/100),"crit","Crit damage only applies on crits, so it’s weighted by crit rate: B × (1 + rate × bonus)."],[B*(1+d/100),"crit","That’s a guaranteed crit. Weight the bonus by the "+c+"% crit rate."]],String(+want.toFixed(1))); }
  const dmg=ri(2,9)*10, aps=pick([0.5,1,1.5,2,2.5]), hp=ri(5,30)*100; const dps=dmg*aps;
  return numQ2("gm:ttk",dmg+" damage per hit, "+aps+" hits per second, enemy has "+hp+" HP. Seconds to kill?",hp/dps,0.05,"Seconds.",[[hp/dmg,"ttk","That’s the number of hits. Divide by hits per second (or divide HP by DPS = "+dps+")."]],String(+(hp/dps).toFixed(2))); }
function gmStack(){ if(Math.random()<0.6){ const B=pick([100,200,500]), a=pick([10,20,30,50]), b=pick([10,20,25,40]), add=Math.random()<0.5; const want=add?B*(1+(a+b)/100):B*(1+a/100)*(1+b/100);
    return numQ2("gm:stk","Base "+B+". Two bonuses: +"+a+"% and +"+b+"%, stacking "+(add?"additively":"multiplicatively")+". Final value?",want,0.05,"A number.",[[add?B*(1+a/100)*(1+b/100):B*(1+(a+b)/100),"stack",add?"Additive: add the percentages first: × (1 + "+(a+b)+"%).":"Multiplicative: apply each one in turn: × "+(1+a/100)+" × "+(1+b/100)+"."]],String(+want.toFixed(2))); }
  const base=100, g=pick([1.2,1.5,2]), n=ri(3,6); const want=base*Math.pow(g,n-1);
  return numQ2("gm:xp","XP needed for level n = 100 × "+g+"ⁿ⁻¹. XP needed for level "+n+"?",want,0.5,"A number (rounding is fine).",[[base*g*(n-1),"growth","That’s linear growth. Exponential means multiplying by "+g+" each level."]],String(+want.toFixed(2))); }

const QUADS=[[2,3,6,7],[1,4,8,9],[2,6,9,11],[4,4,7,9],[2,10,11,15],[6,6,7,11],[3,4,12,13],[1,2,2,3]];
function v3(){ const k=ri(0,3);
  if(k===0){ const q=pick(QUADS), s=q.slice(0,3).map(v=>v*(Math.random()<0.3?-1:1)); return numQ2("vm:mag","Length (magnitude) of the vector ("+s.join(", ")+")?",q[3],0.01,"A number.",[[s.reduce((a,b)=>a+Math.abs(b),0),"vecmag","Magnitude is √(x² + y² + z²), not the sum."]],String(q[3])); }
  if(k===1){ const a=[ri(-5,5),ri(-5,5),ri(-5,5)], b=[ri(-5,5),ri(-5,5),ri(-5,5)]; const d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; return numQ2("vm:dot","Dot product of ("+a.join(", ")+") and ("+b.join(", ")+")?",d,0.01,"A number.",[],String(d)); }
  if(k===2){ const p=pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25]]), comp=Math.random()<0.5?0:1; return numQ2("vm:norm","Normalize ("+p[0]+", "+p[1]+", 0). What’s its "+(comp?"y":"x")+" component?",p[comp]/p[2],0.005,"A decimal, like 0.6.",[[p[comp],"vecnorm","Divide each component by the length ("+p[2]+")."]],String(+(p[comp]/p[2]).toFixed(3))); }
  const q=pick(QUADS); const P=[ri(-5,5),ri(-5,5),ri(-5,5)], Q=[P[0]+q[0],P[1]-q[1],P[2]+q[2]]; return numQ2("vm:dist","Distance between ("+P.join(", ")+") and ("+Q.join(", ")+")?",q[3],0.01,"A number.",[],String(q[3])); }
function v3b(){ const k=ri(0,2);
  if(k===0){ const a=ri(0,20)*10, b=a+ri(2,20)*10, t=pick([0.25,0.5,0.75,0.1,0.9]); const want=a+(b-a)*t; return numQ2("vm:lerp","lerp("+a+", "+b+", "+t+") = ?",want,0.01,"A number.",[[b*t,"lerp","lerp(a, b, t) = a + (b − a) × t."]],String(want)); }
  if(k===1){ const sp=pick([120,180,240,300,600]), fps=pick([30,60,120]); return numQ2("vm:fr","Speed "+sp+" px/second at "+fps+" fps. Pixels moved per frame (speed × delta)?",sp/fps,0.01,"A number.",[[sp*fps,"delta","Delta is 1/"+fps+" of a second, so divide."]],String(+(sp/fps).toFixed(2))); }
  const deg=pick([30,45,60,90,120,180,270]); const want=deg*Math.PI/180; return numQ2("vm:rad","Convert "+deg+"° to radians (2 decimals). Engines usually expect radians.",want,0.01,"A decimal.",[[deg*180/Math.PI,"rad","Multiply by π/180."]],String(+want.toFixed(2))); }

function openCritique(){ const p=$("np-art"); if(!p) return; if(!aiImgMode()){ toast(IS_APP?"Critique needs an image-capable model. Set one up in Settings (for example a vision model in Ollama).":"Critique isn’t available right now.",4500); return; }
  p.innerHTML="<div class=\"crit\"><h3>Get a critique</h3><p class=\"muted\">Upload a drawing, sprite or Blender screenshot. Feedback is most useful when you say what you were going for.</p><input type=\"file\" id=\"crF\" accept=\"image/*\"><img id=\"crPrev\" alt=\"\" hidden><textarea id=\"crT\" rows=\"3\" placeholder=\"What were you going for? What feels off?\"></textarea><div class=\"brow\"><button class=\"btn primary\" id=\"crGo\">Critique it</button><button class=\"btn\" id=\"crBack\">Back to drills</button></div><div class=\"aiout\" id=\"crOut\"></div></div>";
  let file=null; $("crF").addEventListener("change",e=>{ file=e.target.files[0]; if(file){ const u=URL.createObjectURL(file); $("crPrev").src=u; $("crPrev").hidden=false; } });

function aiImgMode(){ if(sampleFn) return "claude"; if(H.settings.aiModel&&H.settings.aiUrl) return "ollama"; return null; }
async function aiAskImg(prompt,file,onText){ const m=aiImgMode();
  if(m==="claude"){ let full=""; await sampleFn(prompt,{ images:[file], onText:({text})=>{ full=text; onText(text); } }); return full; }
  const b64=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(file); });
  const r=await fetch(H.settings.aiUrl.replace(/\/$/,"")+"/api/generate",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ model:H.settings.aiModel, prompt, images:[b64], stream:false }) });
  if(!r.ok) throw new Error("Your model couldn’t read the image. Critique needs a vision model (for example llava or a Gemma 3 vision model)."); const j=await r.json(); onText(j.response||""); return j.response; }

  ["ul",["<b>Angles:</b> compare against 45° and 90° first, then adjust.","<b>Proportions:</b> pick a unit (like a head height) and count how many fit.","<b>Verticals:</b> most people overestimate vertical lengths, so check them deliberately.","Check the overall shape before details: big errors first."]]],practice:[0,1,2,3,4]},

const callOk=s=>typeof s==="string"&&s.length<300&&!/\n/.test(s)&&!/\b(import|open|input|exec|eval|__)\b/.test(s);
function pyLit(s){ return String(s).trim(); }
async function runTests(code,tests){ const h=code.replace(/\t/g,"    ")+"\n\n"+tests.map(t=>"try:\n    __g = "+t.call+"\n    print(\"T|\" + str(__g == ("+pyLit(t.expect)+")) + \"|\" + repr(__g))\nexcept Exception as __x:\n    print(\"E|\" + type(__x).__name__ + \": \" + str(__x))").join("\n");

  const lines=out.split("\n").filter(l=>/^[TE]\|/.test(l)); return { results:tests.map((t,i)=>{ const l=lines[i]||"E|no output"; if(l.startsWith("E|")) return {ok:false,err:l.slice(2)}; const [,ok,got]=l.split("|"); return {ok:ok==="True",got:l.slice(2+ok.length+1)}; }) }; }

  const j2=await aiJSON("Solve each problem carefully. Give only the final numeric answer for each, as a number.\n\n"+withVal.map((x,i)=>(i+1)+". "+x.problem).join("\n\n")+"\n\nReturn ONLY a JSON object: {\"answers\":[12.5]} with one number per problem, in order.");
  const ans=j2.answers||[]; const kept=withVal.filter((x,i)=>{ const a=parseFloat(ans[i]); return Number.isFinite(a)&&Math.abs(a-x.val)<=Math.max(0.011,Math.abs(x.val)*0.01); });
  H.freshStats.kept+=kept.length; saveHub();
  return kept.map(x=>{ const want=x.val, shown=+want.toFixed(2); return { html:"<div class=\"freshtag\">✨ AI-written · answer computed and independently confirmed</div><div class=\"cq\" style=\"text-align:left\">"+esc(x.problem)+"</div>", fmt:"A number"+(x.unit?" ("+x.unit+")":"")+". Rounding to 2 decimals is fine.", answer:esc(shown+(x.unit&&x.unit!=="%"?" "+x.unit:x.unit||"")), sec:sub, fresh:{topic:topic.name,sub,raw:x}, ans:"", flag:false, res:null, conf:"",
    check:r=>{ const v=parseFloat(String(r).replace(/[,$%]/g,"").replace(/[−–]/g,"-")); if(!Number.isFinite(v)) return {invalid:"Type a number."}; if(Math.abs(v-want)<=Math.max(0.011,Math.abs(want)*0.005)) return {ok:true}; return {ok:false,msg:x.explain||"Recheck the setup."}; } }; }); }

  return _startFresh(topic,sub); };

async function cardsFromNote(n){ const out=$("nAi"); out.textContent="Drafting cards from this note…";
  let cards=[]; try { const j=await aiJSON("Turn these study notes into flashcards. Use ONLY information that is in the notes; don’t add outside facts. One fact per card. Fronts are short questions or terms; backs are short answers (under 25 words). Make 4 to 12 cards.\n\nNotes titled \""+n.title+"\":\n"+n.body+"\n\nReturn ONLY a JSON object: {\"cards\":[{\"front\":\"...\",\"back\":\"...\"}]}"); cards=(j.cards||[]).filter(c=>c&&c.front&&c.back).slice(0,15); }
  catch(e){ out.textContent="Couldn’t draft cards. Try again."; return; }
  if(!cards.length){ out.textContent="No cards came back. Try again, or add more detail to the note."; return; }
  const decks=H.cards.custom; out.innerHTML="<div class=\"cardrev\"><b>Review each card</b> <span class=\"muted small\">Only checked cards are added. Edit anything that’s off. These come from your note, but the wording is AI-drafted.</span>"+cards.map((c,i)=>"<div class=\"crow\"><input type=\"checkbox\" checked data-ck=\""+i+"\"><input value=\""+esc(c.front)+"\" data-cf2=\""+i+"\"><input value=\""+esc(c.back)+"\" data-cb2=\""+i+"\"></div>").join("")+
    "<div class=\"brow\"><select id=\"crDeck\"><option value=\"__new\">New deck: "+esc(n.title||"From notes")+"</option>"+decks.map(d=>"<option value=\""+d.id+"\">"+esc(d.name)+"</option>").join("")+"</select><button class=\"btn primary\" id=\"crAdd\">Add checked cards</button></div></div>";
  $("crAdd").addEventListener("click",()=>{ let deck; const v=$("crDeck").value; if(v==="__new"){ deck={id:"u"+Date.now().toString(36),name:n.title||"From notes",cards:[]}; H.cards.custom.push(deck); } else deck=H.cards.custom.find(d=>d.id===v);
    let k=0; out.querySelectorAll("[data-ck]").forEach(cb=>{ if(!cb.checked) return; const i=cb.dataset.ck, f=out.querySelector("[data-cf2=\""+i+"\"]").value.trim(), b=out.querySelector("[data-cb2=\""+i+"\"]").value.trim(); if(f&&b){ deck.cards.push({id:deck.id+":"+Date.now().toString(36)+i,f,b}); k++; } });
    saveHub(); out.innerHTML="<div class=\"good\">"+k+" cards added to “"+esc(deck.name)+"”. They’re in Flashcards now.</div>"; }); }

const STARTER_NOTES=[
 {id:"study",tag:"general",title:"Starter guide: How to study with this app",body:"## Big picture\nLearning sticks when you **pull it out of your head** (retrieval) on a **spread-out schedule** (spacing), and get **fast feedback** when you’re wrong.\n\n## How to use these notes\n- Write the plain version in your own words first.\n- Add the precise terms next to it.\n- Add **where it breaks**: where your analogy stops being true.\n- Add one example.\n- End with quiz lines: the question, a double colon, then the answer (see the Quiz yourself section below). Use ✨ Make flashcards, or import the note into a deck.\n\n## Where it breaks\nRereading these notes feels productive but builds little. Quiz yourself instead.\n\n## Quiz yourself\n- What beats rereading? :: Retrieval practice (testing yourself)\n- Why space reviews out? :: Spaced reviews are remembered far longer than cramming\n- What goes in a “where it breaks” line? :: Where your analogy or simple version stops being true"},
 {id:"draw",tag:"wire",title:"Starter guide: Drawing fundamentals",body:"## Big picture\nDrawing is two skills: **seeing** (judging angles, proportions, values) and **mark-making** (confident lines and ellipses). Fundamentals train both.\n\n## Key terms\n- **Ghosting:** rehearse the motion, then commit in one pass.\n- **Ellipse degree:** how open an ellipse is.\n- **Convergence:** parallel edges in perspective meet at a vanishing point.\n- **Value:** lightness or darkness.\n\n## Where it breaks\n“Draw slowly to be accurate” sounds right, but slow lines wobble. Accuracy comes from planning (ghosting), then speed.\n\n## Example\nA box in two-point perspective: verticals stay vertical, and the other two sets of edges each lean toward their own vanishing point.\n\n## Quiz yourself\n- Which joint for long lines? :: The shoulder\n- What should you do with a bad line? :: Leave it and draw a new one; don’t redraw over it\n- Can parallel box edges spread apart in perspective? :: No, they only converge or stay parallel\n- What do you read before color? :: Value"},
 {id:"math",tag:"math",title:"Starter guide: Algebra essentials",body:"## Big picture\nAn equation is a **balance**: do the same thing to both sides, and undo operations in reverse order.\n\n## Key terms\n- **Like terms:** same variable and power (3x and 5x).\n- **Distribute:** a(b + c) = ab + ac.\n- **Factor:** undo distributing.\n\n## Where it breaks\nInequalities follow the balance rule with one exception: multiplying or dividing by a negative **flips the sign**.\n\n## Example\n3x + 5 = 20 → 3x = 15 → x = 5\n\n## Quiz yourself\n- −2(x + 4) = ? :: −2x − 8\n- Solve 2x − 7 = 9 :: x = 8\n- −3x > 12 → ? :: x < −4 (dividing by a negative flips the sign)\n- (x + 3)² = ? :: x² + 6x + 9\n- Factor x² + 5x + 6 :: (x + 2)(x + 3)"},
 {id:"net",tag:"it",title:"Starter guide: Subnetting and networking",body:"## Big picture\nAn IP address has a **network part** and a **host part**; the mask says where the split is. Subnetting borrows host bits to make more, smaller networks.\n\n## Key terms\n- **Block size:** 256 − the interesting mask octet.\n- **Network address:** first address; **broadcast:** last.\n- **Usable hosts:** 2^(host bits) − 2.\n\n## Where it breaks\n“A subnet is like a street” works for addresses, but routers forward between subnets; switches don’t. Two PCs on different subnets need a router even on the same switch.\n\n## Example\n192.168.10.77/27 → mask .224, block 32 → network .64, broadcast .95, hosts .65–.94 (30 usable)\n\n## Quiz yourself\n- /26 mask? :: 255.255.255.192\n- Usable hosts in a /28? :: 14\n- Network address of 10.0.0.130/25? :: 10.0.0.128\n- Broadcast of 172.16.5.10/24? :: 172.16.5.255\n- What does ARP do? :: Finds the MAC address for an IPv4 address on the local network"},
 {id:"code",tag:"code",title:"Starter guide: Python basics",body:"## Big picture\nA program is instructions run top to bottom. Variables hold values; functions package steps; loops repeat; conditions choose.\n\n## Key terms\n- **return vs print:** return hands a value back; print only displays it.\n- **Mutable:** lists and dicts can change; strings and tuples can’t.\n- **Index:** starts at 0; slices stop before the end.\n\n## Where it breaks\n“A variable is a box” fails for lists: b = a doesn’t copy the list. Both names point to the same list.\n\n## Example\na = [1, 2]\nb = a\nb.append(3)\nprint(a)  # [1, 2, 3]\n\n## Quiz yourself\n- What does 7 // 2 give? :: 3\n- range(1, 5) includes 5? :: No: 1, 2, 3, 4\n- A function with no return gives? :: None\n- \"abc\"[1:] is? :: \"bc\"\n- How do you copy a list? :: a.copy() or a[:]"},
 {id:"jp",tag:"jp",title:"Starter guide: Japanese foundations",body:"## Big picture\nJapanese uses three scripts: **hiragana** (native sounds and grammar), **katakana** (foreign words) and **kanji** (meaning). Sentences usually end with the verb, and **particles** mark each word’s role.\n\n## Key terms\n- **は** topic, **が** subject, **を** object.\n- **に** destination, time, where something exists.\n- **で** where an action happens, or the means.\n\n## Where it breaks\n“は and が both mean the subject” is close but wrong: は sets the topic (“as for…”), が picks out the subject, and question words like だれ take が.\n\n## Example\nへやに ねこが います。 There’s a cat in the room.\nこうえんで あそびます。 I play at the park.\n\n## Quiz yourself\n- Which particle marks the direct object? :: を\n- “at school” for studying? :: がっこうで (action happens there)\n- “in the room” for a cat that is there? :: へやに (existence)\n- Polite past of たべます? :: たべました\n- Negative of たかい? :: たかくない"},
 {id:"cli",tag:"cli",title:"Starter guide: Command line",body:"## Big picture\nCommands are **program + options + arguments**. The same ideas exist on Linux, Windows and Cisco, with different names.\n\n## Key terms\n- **Flags:** options like -l or /all.\n- **Pipe |:** send output to another command.\n- **Privileged mode:** sudo on Linux, Run as administrator on Windows, enable on Cisco.\n\n## Where it breaks\nCommands look interchangeable but aren’t: tracert is Windows, traceroute is Linux; ipconfig is Windows, ip a is Linux.\n\n## Example\nLinux: grep -i error /var/log/syslog | tail -n 20\nCisco: show ip interface brief\n\n## Quiz yourself\n- Linux: list all files in long format :: ls -la\n- Windows: clear DNS cache :: ipconfig /flushdns\n- Windows: which process owns a connection? :: netstat -ano, then match the PID in tasklist\n- Cisco: save the config :: copy running-config startup-config\n- Linux: make script.sh executable :: chmod +x script.sh"},
 {id:"elec",tag:"elec",title:"Starter guide: Electronics for repair work",body:"## Big picture\n**Voltage** pushes, **current** flows, **resistance** limits. Ohm’s law ties them together: V = I × R.\n\n## Key terms\n- **Series:** one path; resistances add.\n- **Parallel:** several paths; total is less than the smallest.\n- **Power:** P = V × I, in watts.\n\n## Where it breaks\nThe water-pipe analogy fails here: current isn’t “used up”. The same current flows all the way around a series loop.\n\n## Example\n5 V across 470 Ω → I = 5 ÷ 470 ≈ 10.6 mA\n\n## Quiz yourself\n- Measure current: series or parallel? :: Series\n- Measure resistance: power on or off? :: Off\n- 100 Ω and 100 Ω in parallel? :: 50 Ω\n- LED resistor formula? :: (Vsupply − Vf) ÷ I\n- JAMMA logic rail? :: +5 V\n- A fuse that blows instantly means? :: A short; find it, never fit a bigger fuse"},
 {id:"tshoot",tag:"trouble",title:"Starter guide: Troubleshooting",body:"## Big picture\nTroubleshooting is **narrowing down**: each test should rule something in or out. Guessing and swapping parts is slow and expensive.\n\n## Key terms\n- **The 7 steps:** identify, theorize, test, plan, implement, verify, document.\n- **Outside in:** power and connections before boards and software.\n\n## Where it breaks\n“Start simple” doesn’t mean “stop at simple”: if the obvious checks pass, follow the evidence even when it points somewhere unexpected.\n\n## Example\nDead button → input test shows nothing → switch tests fine → signal wire has continuity → check the ground wire.\n\n## Quiz yourself\n- First troubleshooting step? :: Identify the problem (gather info, reproduce, ask what changed)\n- Last step? :: Document findings and actions\n- Why change one thing at a time? :: So you know what actually fixed it\n- 169.254 address means? :: No DHCP lease (APIPA)\n- Ping by IP works, by name fails? :: DNS"},
 {id:"sec",tag:"sec",title:"Starter guide: Security fundamentals",body:"## Big picture\nSecurity protects **confidentiality, integrity and availability** (CIA) using layers of controls: technical, physical and managerial.\n\n## Key terms\n- **Symmetric** (one shared key) vs **asymmetric** (key pair).\n- **Hashing:** one-way fingerprint; proves integrity.\n- **Least privilege:** only the access a job needs.\n- **Risk** = likelihood × impact.\n\n## Where it breaks\n“Encryption keeps data safe” only covers confidentiality. An encrypted file can still be deleted (availability) or replaced if it isn’t signed (integrity).\n\n## Example\nTLS uses asymmetric crypto to set up a session, then fast symmetric encryption for the data.\n\n## Quiz yourself\n- What does a hash protect? :: Integrity\n- Sign a message with which key? :: Your private key\n- IDS vs IPS? :: Detects and alerts / sits inline and blocks\n- Buying insurance is which risk response? :: Transfer\n- First step of incident response? :: Preparation"},
 {id:"art",tag:"art",title:"Starter guide: Game art",body:"## Big picture\nPlayers read **shape**, then **value**, then **color**. Readable game art gets those three right before adding detail.\n\n## Key terms\n- **Silhouette:** the outline; it should be recognizable as a solid shape.\n- **Value grouping:** a few clear light, mid and dark areas.\n- **Hue shifting:** cooler shadows, warmer highlights.\n- **3D pipeline:** blockout → model → retopo → UVs → bake → texture → engine.\n\n## Where it breaks\n“More detail looks better” fails at game scale: small or fast-moving things read by shape and contrast, and extra detail becomes noise.\n\n## Example\nA villain with sharp, angular shapes and a dark value against a lighter background reads as a threat instantly.\n\n## Quiz yourself\n- Round shapes usually read as? :: Friendly or safe\n- What do players perceive first? :: Value\n- Why quads for characters? :: Clean subdivision and deformation\n- What does a normal map fake? :: Surface detail through lighting\n- Blender loop cut? :: Ctrl+R"},
 {id:"gdes",tag:"design",title:"Starter guide: Game design",body:"## Big picture\nDesigners build **rules**; players experience **what emerges** from them. A game works when its core loop is fun on its own and its choices are interesting.\n\n## Key terms\n- **Core loop:** the repeated cycle at the heart of play.\n- **Flow:** challenge matched to skill.\n- **Game feel:** responsive controls plus strong feedback.\n- **Scope:** what you can actually finish.\n\n## Where it breaks\n“Players will tell you what’s fun” is only half true: watch what they do, since what they say often differs.\n\n## Example\nPlatformer core loop: run → jump → collect → reach the goal → next level with a new twist.\n\n## Quiz yourself\n- MDA stands for? :: Mechanics, Dynamics, Aesthetics\n- What is a dominant strategy? :: An option that’s always best, so other choices stop mattering\n- Chance of at least one 5% drop in 20 tries? :: 1 − 0.95²⁰ ≈ 64%\n- What is coyote time? :: A brief grace period to jump after leaving a ledge\n- First thing to build? :: The smallest playable prototype of the core loop"},
 {id:"godot",tag:"design",title:"Starter guide: Godot 4",body:"## Big picture\nIn Godot, everything is a **node**. Nodes form **scenes**, and scenes nest inside other scenes. GDScript reads a lot like Python.\n\n## Key terms\n- **_ready():** runs once at the start.\n- **_physics_process(delta):** movement and physics.\n- **Signals:** events nodes emit for others to react to.\n- **@export:** shows a variable in the Inspector.\n\n## Where it breaks\nGodot 3 tutorials use older syntax: export instead of @export, instance() instead of instantiate(), and move_and_slide(velocity) with an argument. Check the version before copying code.\n\n## Example\nextends CharacterBody2D\n@export var speed = 200\nfunc _physics_process(delta):\n    velocity.x = Input.get_axis(\"ui_left\", \"ui_right\") * speed\n    move_and_slide()\n\n## Quiz yourself\n- Function that runs every frame? :: _process(delta)\n- Why multiply by delta? :: Frame-rate independent movement\n- Delete a node safely? :: queue_free()\n- Create a scene instance in Godot 4? :: instantiate()\n- $Player means? :: get_node(\"Player\")"}];

/* ================= starter study guides (Notes) ================= */
function quizCards(body,deckId){ let k=0; const i=body.indexOf("## Quiz yourself"); if(i>=0) body=body.slice(i); return body.split("\n").map(l=>l.split(" :: ")).filter(p=>p.length===2&&p[0].trim()&&p[1].trim()).map(p=>({id:deckId+":s"+(k++),f:p[0].replace(/^\s*[-*]\s*/,"").trim(),b:p[1].trim()})); }
function addStarter(s,withCards){ const id="starter-"+s.id; if(!H.notes.some(n=>n.id===id)) H.notes.push({id,title:s.title.replace(/^Starter guide: /,""),body:s.body,tag:s.tag,c:Date.now(),u:Date.now(),starter:1});
  let made=0; if(withCards){ const did="ustarter-"+s.id; let d=H.cards.custom.find(x=>x.id===did); if(!d){ d={id:did,name:s.title.replace(/^Starter guide: /,""),cards:[]}; H.cards.custom.push(d); } const have=new Set(d.cards.map(c=>c.f)); quizCards(s.body,did).forEach(c=>{ if(!have.has(c.f)){ d.cards.push(c); made++; } }); }
  saveHub(); return made; }
function renderStarter(){ const ed=$("nEd"); const has=id=>H.notes.some(n=>n.id==="starter-"+id), hasDeck=id=>H.cards.custom.some(d=>d.id==="ustarter-"+id);
  ed.innerHTML="<div class=\"starter\"><h3>📚 Starter study guides</h3><p class=\"muted\">One per subject, written the way good notes work: the plain idea, key terms, <b>where it breaks</b>, an example, and quiz lines (question, double colon, answer). Add them as your own notes to edit freely, or add them with a flashcard deck built from the quiz lines.</p><div class=\"brow\"><button class=\"btn primary sm\" id=\"stAll\">Add all as notes + flashcards</button></div>"+
    STARTER_NOTES.map(s=>"<div class=\"strow\"><div><b>"+esc(s.title.replace(/^Starter guide: /,""))+"</b><small class=\"muted\">"+esc((TAGS.find(t=>t[0]===s.tag)||["","General"])[1])+" · "+quizCards(s.body,"x").length+" quiz lines</small></div><div class=\"pb\">"+(has(s.id)?"<span class=\"good small\">✓ In notes</span>":"<button class=\"btn sm\" data-sta=\""+s.id+"\">Add note</button>")+(hasDeck(s.id)?"<span class=\"good small\">✓ Deck</span>":"<button class=\"btn sm\" data-stc=\""+s.id+"\">+ Flashcards</button>")+"</div></div>").join("")+"</div>";
  const find=id=>STARTER_NOTES.find(s=>s.id===id);
  ed.querySelectorAll("[data-sta]").forEach(b=>b.addEventListener("click",()=>{ addStarter(find(b.dataset.sta),false); toast("Added to your notes."); renderNotesKeepStarter(); }));
  ed.querySelectorAll("[data-stc]").forEach(b=>b.addEventListener("click",()=>{ const n=addStarter(find(b.dataset.stc),true); toast("Added the note and "+n+" flashcards."); renderNotesKeepStarter(); }));
  $("stAll").addEventListener("click",()=>{ let n=0; STARTER_NOTES.forEach(s=>{ n+=addStarter(s,true); }); toast("Added "+STARTER_NOTES.length+" study guides and "+n+" new flashcards.",4000); renderNotesKeepStarter(); }); }
function renderNotesKeepStarter(){ curNote=null; renderNotes(); renderStarter(); }

/* ================= shell wiring ================= */
$("navBtn").addEventListener("click",()=>document.body.classList.toggle("navopen"));
$("scrim").addEventListener("click",()=>document.body.classList.remove("navopen"));
$("qNote").addEventListener("click",()=>{ const tag=APPS[view]?view:"general"; openQuickNote(APPS[view]?APPS[view].name+" note":"",tag); });
window.addEventListener("storage",e=>{ if(view==="home"&&e.key&&/^buzz/.test(e.key)) renderHome(); });
setInterval(()=>{ if(view==="home") renderHome(); },60000);
applyTheme(); resetFocus(); route(); initCloud();
window.__hub={ openTrainer, mount, makeQ, PRESETS, startTest, H:()=>H };
})();

</script>
